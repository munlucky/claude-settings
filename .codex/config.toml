#:schema https://developers.openai.com/codex/config-schema.json

# Claude Settings - Codex project configuration.
# Based on the ECC reference config, trimmed for this repository and Windows-safe defaults.

approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

# Keep model/model_provider unset so Codex uses the installed app/CLI defaults.

[mcp_servers.github]
command = "node"
args = [".claude/scripts/codex-mcp-singleton.mjs", "github", "--", "npx", "-y", "@modelcontextprotocol/server-github"]
startup_timeout_sec = 30

[mcp_servers.context7]
command = "node"
args = [".claude/scripts/codex-mcp-singleton.mjs", "context7", "--", "npx", "-y", "@upstash/context7-mcp@latest"]
startup_timeout_sec = 30

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"

[mcp_servers.memory]
command = "node"
args = [".claude/scripts/codex-mcp-singleton.mjs", "memory", "--", "node", ".claude/scripts/memorygraph-mcp-wrapper.js"]
startup_timeout_sec = 30

[mcp_servers.code-review-graph]
command = "node"
args = [".claude/scripts/codex-mcp-singleton.mjs", "code-review-graph", "--", "node", ".claude/scripts/code-review-graph-mcp-wrapper.js"]
startup_timeout_sec = 30

[mcp_servers.playwright]
command = "node"
args = [".claude/scripts/codex-mcp-singleton.mjs", "playwright", "--", "npx", "-y", "@playwright/mcp@latest", "--extension"]
startup_timeout_sec = 30

[mcp_servers.sequential-thinking]
command = "node"
args = [".claude/scripts/codex-mcp-singleton.mjs", "sequential-thinking", "--", "npx", "-y", "@modelcontextprotocol/server-sequential-thinking"]
startup_timeout_sec = 30

# Optional MCP servers:
#
# [mcp_servers.supabase]
# command = "npx"
# args = ["-y", "supabase-mcp-server@latest", "--read-only"]
#
# [mcp_servers.firecrawl]
# command = "npx"
# args = ["-y", "firecrawl-mcp"]
#
# [mcp_servers.fal-ai]
# command = "npx"
# args = ["-y", "fal-ai-mcp-server"]
#
# [mcp_servers.cloudflare]
# command = "npx"
# args = ["-y", "@cloudflare/mcp-server-cloudflare"]

[features]
multi_agent = true

[profiles.strict]
approval_policy = "on-request"
sandbox_mode = "read-only"
web_search = "cached"

[profiles.yolo]
approval_policy = "never"
sandbox_mode = "workspace-write"
web_search = "live"

[agents]
max_threads = 6
max_depth = 1
