schemaVersion: 1
profileId: claude-development-profile
role: development_profile
canonicalSourceContract: package/package-contract.yaml
compatibilityPolicy: move_with_wrapper_until_phase_06
sourcePolicy:
  durableSourceRoots:
    - skills/
    - agents/
    - rules/
    - scripts/
    - schemas/
    - templates/
    - tests/
    - docs/public/
  generatedProfileRoots:
    - .claude/skills/
    - .claude/agents/
    - .claude/rules/
  commonHarnessRoot: "${MOONSHOT_RELAY_HOME:-~/.moonshot-relay}/"
  rule: "Edit canonical source first; expose only service profile files in .claude and keep common harness files under MOONSHOT_RELAY_HOME."
activeRuntimeFiles:
  - .claude/CLAUDE.md
  - .claude/PROJECT.md
  - .claude/README.md
  - .claude/agents/**
  - .claude/rules/**
  - .claude/skills/**
  - .claude/verification.contract.yaml
excludedGeneratedState:
  - .claude/logs/**
  - .claude/cache/**
  - .claude/traces/**
  - .claude/browser-artifacts/**
  - .claude/browser-runtime/**
  - .claude/tmp/**
  - .claude/runtime-state.sqlite*
  - .claude/memory.json
  - .claude/memorygraph/**
  - .claude/*verdict*.json
  - .claude/knowledge-repo-audit-*.json
