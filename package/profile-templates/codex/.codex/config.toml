#:schema https://developers.openai.com/codex/config-schema.json

model_context_window = 272000
model_auto_compact_token_limit = 240000

# Claude Settings - Codex project configuration.
# Based on the ECC reference config, trimmed for this repository and Windows-safe defaults.

approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

# Keep model/model_provider unset so Codex uses the installed app/CLI defaults.

[mcp_servers.github]
command = "node"
args = ["--input-type=module", "-e", "import path from 'node:path'; import os from 'node:os'; import { pathToFileURL } from 'node:url'; const home = process.env.MOONSHOT_RELAY_HOME || path.join(os.homedir(), '.moonshot-relay'); const script = path.join(home, 'scripts', 'codex-mcp-singleton.mjs'); process.argv = [process.argv[0], script, ...process.argv.slice(1)]; await import(pathToFileURL(script).href);", "github", "--", "npx", "-y", "@modelcontextprotocol/server-github"]
startup_timeout_sec = 30

[mcp_servers.context7]
command = "node"
args = ["--input-type=module", "-e", "import path from 'node:path'; import os from 'node:os'; import { pathToFileURL } from 'node:url'; const home = process.env.MOONSHOT_RELAY_HOME || path.join(os.homedir(), '.moonshot-relay'); const script = path.join(home, 'scripts', 'codex-mcp-singleton.mjs'); process.argv = [process.argv[0], script, ...process.argv.slice(1)]; await import(pathToFileURL(script).href);", "context7", "--", "npx", "-y", "@upstash/context7-mcp@latest"]
startup_timeout_sec = 30

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"

[mcp_servers.memory]
command = "node"
args = ["--input-type=module", "-e", "import path from 'node:path'; import os from 'node:os'; import { pathToFileURL } from 'node:url'; const home = process.env.MOONSHOT_RELAY_HOME || path.join(os.homedir(), '.moonshot-relay'); const script = path.join(home, 'scripts', 'codex-mcp-singleton.mjs'); process.argv = [process.argv[0], script, ...process.argv.slice(1)]; await import(pathToFileURL(script).href);", "memory", "--", "@moonshot-node", "<MOONSHOT_RELAY_HOME>/scripts/memorygraph-mcp-wrapper.mjs"]
startup_timeout_sec = 30

[mcp_servers.code-review-graph]
command = "node"
args = ["--input-type=module", "-e", "import path from 'node:path'; import os from 'node:os'; import { pathToFileURL } from 'node:url'; const home = process.env.MOONSHOT_RELAY_HOME || path.join(os.homedir(), '.moonshot-relay'); const script = path.join(home, 'scripts', 'codex-mcp-singleton.mjs'); process.argv = [process.argv[0], script, ...process.argv.slice(1)]; await import(pathToFileURL(script).href);", "code-review-graph", "--", "@moonshot-node", "<MOONSHOT_RELAY_HOME>/scripts/code-review-graph-mcp-wrapper.js"]
startup_timeout_sec = 30

[mcp_servers.playwright]
command = "node"
args = ["--input-type=module", "-e", "import path from 'node:path'; import os from 'node:os'; import { pathToFileURL } from 'node:url'; const home = process.env.MOONSHOT_RELAY_HOME || path.join(os.homedir(), '.moonshot-relay'); const script = path.join(home, 'scripts', 'codex-mcp-singleton.mjs'); process.argv = [process.argv[0], script, ...process.argv.slice(1)]; await import(pathToFileURL(script).href);", "playwright", "--", "npx", "-y", "@playwright/mcp@latest", "--extension"]
startup_timeout_sec = 30

[mcp_servers.sequential-thinking]
command = "node"
args = ["--input-type=module", "-e", "import path from 'node:path'; import os from 'node:os'; import { pathToFileURL } from 'node:url'; const home = process.env.MOONSHOT_RELAY_HOME || path.join(os.homedir(), '.moonshot-relay'); const script = path.join(home, 'scripts', 'codex-mcp-singleton.mjs'); process.argv = [process.argv[0], script, ...process.argv.slice(1)]; await import(pathToFileURL(script).href);", "sequential-thinking", "--", "npx", "-y", "@modelcontextprotocol/server-sequential-thinking"]
startup_timeout_sec = 30

# Optional MCP servers:
#
# [mcp_servers.supabase]
# command = "npx"
# args = ["-y", "supabase-mcp-server@latest", "--read-only"]
#
# [mcp_servers.firecrawl]
# command = "npx"
# args = ["-y", "firecrawl-mcp"]
#
# [mcp_servers.fal-ai]
# command = "npx"
# args = ["-y", "fal-ai-mcp-server"]
#
# [mcp_servers.cloudflare]
# command = "npx"
# args = ["-y", "@cloudflare/mcp-server-cloudflare"]

[features]
multi_agent = true

[profiles.strict]
approval_policy = "on-request"
sandbox_mode = "read-only"
web_search = "cached"

[profiles.yolo]
approval_policy = "never"
sandbox_mode = "workspace-write"
web_search = "live"

[agents]
max_threads = 6
max_depth = 1
