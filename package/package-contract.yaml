schemaVersion: 1
contractId: repository-physical-structure-refactor-phase-02
description: "Canonical source and package payload contract for Claude and Codex runtime profiles."

canonicalSource:
  skills: skills/
  agents: agents/
  rules: rules/
  scripts: scripts/ # maintained support source; workflow scripts are not broadly installed
  bin: bin/
  tools: tools/
  schemas: schemas/
  templates: templates/
  tests: tests/
  publicDocs: docs/public/
  implementationPlans: docs/implementation/
  verificationContracts: schemas/

runtimeProfiles:
  moonshotRelay:
    generatedProfileRoot: package/moonshot-relay/profile/
    localRuntimeRoot: ${MOONSHOT_RELAY_HOME:-~/.moonshot-relay}/
    materializer: package/build-package.mjs
    materialization: account_root_common_payload
  claude:
    templateRoot: package/profile-templates/claude/.claude/
    generatedProfileRoot: package/claude/profile/.claude/
    localRuntimeRoot: .claude/
    pluginOutputRoot: .claude-plugin/
    materializer: package/build-package.mjs
    materialization: local_copy_not_committed
    symlinkPolicy: avoid_required_symlinks
  codex:
    templateRoot: package/profile-templates/codex/.codex/
    generatedProfileRoot: package/codex/profile/.codex/
    localRuntimeRoot: .codex/
    pluginOutputRoot: .codex-plugin/
    materializer: package/build-package.mjs
    materialization: local_copy_not_committed
    symlinkPolicy: avoid_required_symlinks

accountRootInstall:
  installer: scripts/install-account-root-harness.mjs
  defaultShellInstaller: install-claude.sh
  mode: account-root-direct
  projectCompatibilityMode: "install-claude.sh --project"
  sharedRuntimeHome:
    env: MOONSHOT_RELAY_HOME
    windowsCmd: "%MOONSHOT_RELAY_HOME%"
    windowsPowerShell: "$env:MOONSHOT_RELAY_HOME"
    posixShell: "${MOONSHOT_RELAY_HOME}"
    default: "~/.moonshot-relay"
  targets:
    common: "${MOONSHOT_RELAY_HOME:-~/.moonshot-relay}"
    claude: "${CLAUDE_HOME:-~/.claude}"
    codex: "${CODEX_HOME:-~/.codex}"
  commonPayloadEntries:
    - bin/
    - docs/public/
    - rules/
    - schemas/
    - scripts/
    - skills/
    - templates/
    - tools/
    - node_modules/
    - package/
    - package.json
    - package-lock.json
    - verification.contract.yaml
  runtimeExposureEntries:
    claude:
      - CLAUDE.md
      - PROJECT.md
      - README.md
      - agents/
      - profile-contract.yaml
      - rules/
      - skills/
      - verification.contract.yaml
    codex:
      - AGENTS.md
      - README.md
      - agents/
      - rules/
      - skills/
      - verification.contract.yaml
  manifestName: .moonshot-relay-install-manifest.json
  legacyManifestNames:
    - .claude-settings-install-manifest.json
  legacyHarnessCorePolicy: remove_when_requested_after_backup
  protectedRuntimeEntries:
    claude:
      - settings.json
      - memory.json
      - sessions/
      - cache/
      - plugins/
      - projects/
      - telemetry/
    codex:
      - auth.json
      - config.toml
      - sessions/
      - cache/
      - plugins/
      - memories/
      - sqlite/
  statePolicy: "Account-root profile installation must not write project knowledge, execution evidence, phase status, runtime logs, or verification verdict state."
  runtimeDependencyDelivery:
    nativeSqlite:
      package: better-sqlite3
      versionSource: package-lock.json
      packagedMetadata:
        - package.json
        - package-lock.json
        - node_modules/better-sqlite3/**
        - node_modules/bindings/**
      degradationStatus: typed_degraded_authority_blocked
  rolloutSmokeLevels:
    - source-smoke
    - package-smoke
    - temp-home-smoke
    - live-account-root-smoke
  liveMutationPolicy: "Live account-root adoption requires explicit approval, state preservation evidence, and rollback evidence."
  preservedStateRoots:
    - "${MOONSHOT_RELAY_HOME:-~/.moonshot-relay}/state/**"
    - "${CLAUDE_HOME:-~/.claude}/sessions/**"
    - "${CLAUDE_HOME:-~/.claude}/memory.json"
    - "${CODEX_HOME:-~/.codex}/sessions/**"
    - "${CODEX_HOME:-~/.codex}/auth.json"
    - "${CODEX_HOME:-~/.codex}/sqlite/**"

skillExposure:
  manifest: package/runtime-surface.json
  commonPayloadSkillPolicy: preserve_all_canonical_skills
  serviceProfileSkillPolicy: allowlist_only
  managedSkillPrunePolicy: prune_previously_managed_profile_skills_absent_from_current_payload_preserve_external
  publicRuntimeSkills:
    - product-orchestrator
    - moonshot-architecture
    - moonshot-orchestrator
    - moonshot-phase-runner
    - moonshot-plan-writer
    - commit-moonshot
    - session-logger
  internalSkillPolicy: "Internal and optional skills remain canonical source under skills/ and are preserved in the shared Moonshot Relay common payload, but Claude/Codex runtime profile discovery must not materialize them under profile-local skills/."
  bootstrapSkillPolicy: "moonshot-relay-setup may be installed by Agent Skills CLI from repository source, but it is not part of the Claude/Codex account-root runtime profile public discovery surface."

requiredPayloadEntries:
  sharedSource:
    - source: package/runtime-surface.json
      purpose: runtime_skill_surface_manifest
    - source: skills/**
      purpose: skill_definitions
    - source: agents/**
      purpose: agent_definitions
    - source: rules/**
      purpose: workflow_policy
    - source: bin/**
      purpose: runtime_entrypoints
    - source: tools/**
      purpose: runtime_tooling
    - source: schemas/**
      purpose: machine_readable_contracts
    - source: schemas/context-pack.schema.json
      purpose: context_pack_v1_contract
    - source: schemas/awtl-testcase-candidate-v1.schema.json
      purpose: awtl_trace_to_testcase_candidate_contract
    - source: schemas/improvement-candidate-v1.schema.json
      purpose: eval_gated_improvement_candidate_contract_no_auto_source_mutation
    - source: schemas/memory-promotion-ledger.schema.json
      purpose: runtime_memory_promotion_ledger_contract
    - source: templates/**
      purpose: reusable_templates
    - source: docs/public/**
      purpose: public_documentation
    - source: docs/implementation/*/[0-9][0-9]-*.md
      purpose: source_local_implementation_phase_plans_not_installed
    - source: docs/implementation/*/planning-loop/**
      purpose: source_local_plan_review_artifacts_not_installed
    - source: tests/package-layout.test.mjs
      purpose: package_layout_materialization_guard
    - source: scripts/install-account-root-harness.mjs
      purpose: account_root_direct_profile_installer
    - source: package.json
      purpose: runtime_dependency_manifest
    - source: package-lock.json
      purpose: runtime_dependency_lockfile
    - source: node_modules/better-sqlite3/**
      purpose: runtime_state_native_sqlite_dependency
    - source: tools/evals/harness-control-plane.mjs
      purpose: harness_control_plane_golden_eval_gate
    - source: tools/evals/fixtures/harness-control-plane/golden-regression.json
      purpose: packaged_harness_control_plane_golden_eval_fixture
    - source: tools/awtl/trace-to-testcase.mjs
      purpose: awtl_trace_to_testcase_candidate_generation
  commonSupportScripts:
    description: "Moonshot Relay common runtime payload installs only support scripts needed by installers, MCP wrappers, memory refresh, workflow state, and commit closeout. Service profiles do not install scripts/**."
    entries:
      - source: scripts/architecture-context-build.mjs
        purpose: architecture_context_pack_builder
      - source: scripts/awtl-memory-promotion.mjs
        purpose: memory_promotion_support
      - source: scripts/architecture-artifact-validate.mjs
        purpose: architecture_artifact_contract_validation
      - source: scripts/browser-flow-runner.mjs
        purpose: browser_flow_runtime_verdict_support
      - source: scripts/code-review-graph-mcp-wrapper.js
        purpose: code_review_graph_mcp_wrapper
      - source: scripts/codex-mcp-singleton.mjs
        purpose: mcp_singleton_guard
      - source: scripts/commit-moonshot-closeout-event.mjs
        purpose: commit_closeout_git_event_cli
      - source: scripts/commit-moonshot-memory-refresh.mjs
        purpose: commit_memory_refresh
      - source: scripts/commit-moonshot-promotion-audit.mjs
        purpose: commit_memory_promotion_audit
      - source: scripts/context-state.mjs
        purpose: context_state_control_plane_cli
      - source: scripts/install-account-root-harness.mjs
        purpose: account_root_direct_profile_installer
      - source: scripts/install-browser-runtime.mjs
        purpose: browser_runtime_install_support
      - source: scripts/install-browser-runtime.sh
        purpose: browser_runtime_install_entrypoint
      - source: scripts/install-project-runtime-bridge.mjs
        purpose: downstream_project_runtime_bridge_installer
      - source: scripts/knowledge-context-build.mjs
        purpose: project_knowledge_context
      - source: scripts/knowledge-improvement-lifecycle.mjs
        purpose: project_knowledge_lifecycle
      - source: scripts/knowledge-records.mjs
        purpose: project_knowledge_record_parser
      - source: scripts/lib/awtl-event-schema.mjs
        purpose: awtl_event_schema_support
      - source: scripts/lib/awtl-failure-attribution.mjs
        purpose: awtl_failure_attribution_support
      - source: scripts/lib/awtl-harness-capture.mjs
        purpose: awtl_harness_capture_support
      - source: scripts/lib/awtl-memory-candidate.mjs
        purpose: awtl_memory_candidate_support
      - source: scripts/lib/awtl-memory-promotion.mjs
        purpose: awtl_memory_promotion_support
      - source: scripts/lib/awtl-redaction.mjs
        purpose: awtl_redaction_support
      - source: scripts/lib/awtl-replay-probes.mjs
        purpose: awtl_replay_probe_support
      - source: scripts/lib/awtl-replay-scorecard.mjs
        purpose: awtl_replay_scorecard_support
      - source: scripts/lib/awtl-trace-sink.mjs
        purpose: awtl_trace_sink_support
      - source: scripts/lib/context-state-engine.mjs
        purpose: context_state_engine_support
      - source: scripts/lib/commit-closeout-events.mjs
        purpose: commit_closeout_event_contract
      - source: scripts/lib/failure-classifier.mjs
        purpose: failure_classifier_support
      - source: scripts/lib/git-safe.mjs
        purpose: git_safe_child_process_support
      - source: scripts/lib/phase-event-ledger.mjs
        purpose: workflow_event_ledger_support
      - source: scripts/lib/phase-run-lease-store.mjs
        purpose: workflow_run_lease_support
      - source: scripts/lib/runtime-state-db-path.mjs
        purpose: runtime_state_db_path_support
      - source: scripts/lib/runtime-state-root.mjs
        purpose: runtime_state_root_support
      - source: scripts/lib/runtime-unavailable-cache.mjs
        purpose: runtime_unavailable_cache_support
      - source: scripts/memory-mcp-wrapper.js
        purpose: memory_mcp_wrapper
      - source: scripts/memorygraph-direct.mjs
        purpose: memorygraph_direct_fallback
      - source: scripts/memorygraph-mcp-wrapper.js
        purpose: memorygraph_mcp_entrypoint
      - source: scripts/memorygraph-mcp-wrapper.mjs
        purpose: memorygraph_mcp_wrapper
      - source: scripts/memorygraph-project-index.mjs
        purpose: memorygraph_project_index
      - source: scripts/ontology-constraint-validate.mjs
        purpose: ontology_validation_support
      - source: scripts/phase-final-guard.mjs
        purpose: phase_runner_final_stop_and_turn_ended_guard
      - source: scripts/prepare-phase-runner-state.mjs
        purpose: phase_plan_readiness_bridge
      - source: scripts/project-identity.mjs
        purpose: project_identity_resolution
      - source: scripts/runtime-state.mjs
        purpose: runtime_state_control_plane_cli
      - source: scripts/verification-plane.mjs
        purpose: verification_plane_evidence_cli
      - source: scripts/verification-verdict-state.mjs
        purpose: verification_state_support
      - source: scripts/lib/runtime-state-store.mjs
        purpose: runtime_state_control_plane_store
      - source: scripts/lib/verification-plane.mjs
        purpose: verification_plane_evidence_support
  archivedLegacyScripts:
    description: "Legacy delegated-terminal phase adapters, diagnostics, and script-local tests are preserved as source archive only. They are not active runtime payload and are not copied into installed profiles."
    root: archive/scripts/legacy-phase-adapters/
    originalRoot: scripts/
  verificationContracts:
    - currentSource: schemas/verification.contract.yaml
      localRuntimeTarget: .claude/verification.contract.yaml
      migrationPolicy: materialize_to_local_runtime_only
  claudeRuntime:
    - target: package/profile-templates/claude/.claude/
      role: runtime_specific_static_template
    - target: package/claude/profile/.claude/
      generatedFrom: sharedSource
      materializer: package/build-package.mjs
      role: ignored_generated_package_payload
    - target: .claude/
      generatedFrom: sharedSource
      role: local_runtime_profile_not_committed
    - target: .claude-plugin/
      generatedFrom: package/build-package.mjs
      role: package_output
  codexRuntime:
    - target: package/profile-templates/codex/.codex/
      role: runtime_specific_static_template
    - target: package/codex/profile/.codex/
      generatedFrom: sharedSource
      materializer: package/build-package.mjs
      role: ignored_generated_package_payload
    - target: .codex/
      generatedFrom: sharedSource
      role: local_runtime_profile_not_committed
    - target: .codex-plugin/
      generatedFrom: package/build-package.mjs
      role: package_output

excludedGeneratedState:
  - scripts/fixtures/**
  - scripts/**/fixtures/**
  - scripts/**/*.test.mjs
  - scripts/**/*.e2e.test.mjs
  - agents/**/*_test.py
  - agents/**/*.test.py
  - tests/fixtures/**
  - docs/implementation/**/execution/**
  - docs/implementation/**/close/**
  - docs/implementation/**/archive/**
  - .claude/logs/**
  - .moonshot-relay/browser-artifacts/**
  - .moonshot-relay/eval-artifacts/**
  - .moonshot-relay/verification-reports/**
  - .moonshot-relay/**
  - .moonshot-state/**
  - .claude/cache/**
  - .claude/traces/**
  - .claude/browser-artifacts/**
  - .claude/sandbox-artifacts/**
  - .claude/browser-runtime/**
  - .claude/tools/**/node_modules/**
  - .claude/tmp/**
  - .claude/runtime-state.sqlite*
  - .claude/memory.json
  - .claude/memorygraph/**
  - .claude/*verdict*.json
  - .claude/knowledge-repo-audit-*.json
  - .codex/cache/**
  - .codex/sqlite/**
  - .codex/memories/**
  - .codex/sessions/**
  - .code-review-graph/**

driftPolicy:
  sourceOfTruth: canonicalSource
  compatibilityPolicy: local_runtime_profile_only
  duplicateSourcePolicy: "Do not maintain committed duplicates between root source directories and local runtime output."
  generatedCopyPolicy: "Generated profile copies must be reproducible from package/build-package.mjs or scripts/install-account-root-harness.mjs and are not committed."
  windowsMaterializationPolicy: "Installers must not require symlink support unless Windows validation is added before release."
