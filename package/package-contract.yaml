schemaVersion: 1
contractId: repository-physical-structure-refactor-phase-02
description: "Canonical source and package payload contract for Claude and Codex runtime profiles."

canonicalSource:
  skills: skills/
  agents: agents/
  rules: rules/
  scripts: scripts/
  bin: bin/
  tools: tools/
  schemas: schemas/
  templates: templates/
  tests: tests/
  publicDocs: docs/public/
  verificationContracts: schemas/

runtimeProfiles:
  claude:
    templateRoot: package/profile-templates/claude/.claude/
    generatedProfileRoot: package/claude/profile/.claude/
    compatibilityRoot: .claude/
    pluginOutputRoot: .claude-plugin/
    materializer: package/build-package.mjs
    materialization: generated_copy_not_committed
    symlinkPolicy: avoid_required_symlinks
  codex:
    templateRoot: package/profile-templates/codex/.codex/
    generatedProfileRoot: package/codex/profile/.codex/
    compatibilityRoot: .codex/
    pluginOutputRoot: .codex-plugin/
    materializer: package/build-package.mjs
    materialization: generated_copy_not_committed
    symlinkPolicy: avoid_required_symlinks

requiredPayloadEntries:
  sharedSource:
    - source: skills/**
      purpose: skill_definitions
    - source: agents/**
      purpose: agent_definitions
    - source: rules/**
      purpose: workflow_policy
    - source: scripts/**
      purpose: executable_support
    - source: bin/**
      purpose: runtime_entrypoints
    - source: tools/**
      purpose: runtime_tooling
    - source: schemas/**
      purpose: machine_readable_contracts
    - source: templates/**
      purpose: reusable_templates
    - source: docs/public/**
      purpose: public_documentation
    - source: tests/package-layout.test.mjs
      purpose: package_layout_materialization_guard
  verificationContracts:
    - currentSource: .claude/verification.contract.yaml
      canonicalTarget: schemas/verification.contract.yaml
      migrationPolicy: move_with_wrapper_until_phase_06
  claudeRuntime:
    - target: package/profile-templates/claude/.claude/
      role: runtime_specific_static_template
    - target: package/claude/profile/.claude/
      generatedFrom: sharedSource
      materializer: package/build-package.mjs
      role: ignored_generated_package_payload
    - target: .claude/
      generatedFrom: sharedSource
      role: compatibility_wrapper_until_phase_06
    - target: .claude-plugin/
      generatedFrom: package/build-package.mjs
      role: package_output
  codexRuntime:
    - target: package/profile-templates/codex/.codex/
      role: runtime_specific_static_template
    - target: package/codex/profile/.codex/
      generatedFrom: sharedSource
      materializer: package/build-package.mjs
      role: ignored_generated_package_payload
    - target: .codex/
      generatedFrom: sharedSource
      role: development_profile
    - target: .codex-plugin/
      generatedFrom: package/build-package.mjs
      role: package_output

excludedGeneratedState:
  - scripts/fixtures/**
  - scripts/**/fixtures/**
  - scripts/**/*.test.mjs
  - scripts/**/*.e2e.test.mjs
  - agents/**/*_test.py
  - agents/**/*.test.py
  - tests/fixtures/**
  - .claude/logs/**
  - .claude/cache/**
  - .claude/traces/**
  - .claude/browser-artifacts/**
  - .claude/browser-runtime/**
  - .claude/tools/**/node_modules/**
  - .claude/tmp/**
  - .claude/runtime-state.sqlite*
  - .claude/memory.json
  - .claude/memorygraph/**
  - .claude/*verdict*.json
  - .claude/knowledge-repo-audit-*.json
  - .code-review-graph/**

driftPolicy:
  sourceOfTruth: canonicalSource
  compatibilityPolicy: move_with_wrapper_until_phase_06
  duplicateSourcePolicy: "Do not maintain long-lived manual duplicates between root source directories and generated runtime output."
  generatedCopyPolicy: "Generated profile copies must be reproducible from package/build-package.mjs and are not committed."
  windowsMaterializationPolicy: "Installers must not require symlink support unless Windows validation is added before release."
