schemaVersion: 1
policyRevision: kernel-model-routing.v1

# Provider-neutral workload classes only. Provider model ids and effort values
# are resolved by the Host registry, never here.
thresholds:
  retryEscalationThreshold: 2
  stagnationThreshold: 3

executionClasses:
  planning:
    requiredCapabilities: [complex_reasoning, planning, review]
    providerModelRequired: true
  complex_implementation:
    requiredCapabilities: [complex_reasoning, code_edit, test_authoring, debugging]
    providerModelRequired: true
  review:
    requiredCapabilities: [complex_reasoning, planning, review]
    providerModelRequired: true
  standard:
    requiredCapabilities: [code_edit, test_authoring, debugging]
    providerModelRequired: true

actionDefaults:
  understand:
    executionClass: planning
    role: planner
    permissions: read_only
  design:
    executionClass: planning
    role: planner
    permissions: plan_write
  plan:
    executionClass: planning
    role: planner
    permissions: plan_write
  implement:
    executionClass: standard
    role: implementer
    permissions: workspace_write
  debug:
    executionClass: standard
    role: implementer
    permissions: workspace_write
  review_contract:
    executionClass: review
    role: reviewer
    permissions: read_only
  review_engineering:
    executionClass: review
    role: reviewer
    permissions: read_only
  replan:
    executionClass: planning
    role: planner
    permissions: plan_write
  prove:
    role: kernel
    permissions: kernel_runtime
  close:
    role: kernel
    permissions: kernel_runtime
