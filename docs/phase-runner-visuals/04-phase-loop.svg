<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="각 Phase 안에서 도는 루프">
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/></filter>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M2,2 L8,5 L2,8 Z" fill="#2563EB"/></marker>
</defs>
<rect width="1600" height="900" fill="#FAFAFA"/>
<g transform="translate(-130 0)">
<text x="340" y="82" font-family='&quot;Plus Jakarta Sans&quot;, Inter, &quot;Noto Sans KR&quot;, sans-serif' font-size="42" font-weight="800" fill="#18181B" text-anchor="start" letter-spacing="0">각 Phase 안에서 도는 루프</text>
<text x="342" y="122" font-family='Inter, &quot;Noto Sans KR&quot;, Arial, sans-serif' font-size="18" font-weight="500" fill="#6B7280" text-anchor="start" letter-spacing="0">한 phase는 구현만 하는 단위가 아니라 리뷰와 검증까지 포함한다</text>
<circle cx="930" cy="420" r="230" fill="none" stroke="#DBEAFE" stroke-width="24"/>
<rect x="770" y="142" width="320" height="96" rx="12" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1" filter="url(#shadow)"/>
<text x="930" y="182" font-family='Inter, &quot;Noto Sans KR&quot;, Arial, sans-serif' font-size="22" font-weight="800" fill="#18181B" text-anchor="middle" letter-spacing="0">Ready / Isolate</text>
<text x="930" y="214" font-family='Inter, &quot;Noto Sans KR&quot;, Arial, sans-serif' font-size="15" font-weight="600" fill="#52525B" text-anchor="middle" letter-spacing="0">계약·컨텍스트·검증 기준 확인</text>
<rect x="1040" y="302" width="320" height="96" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
<text x="1200" y="342" font-family='Inter, &quot;Noto Sans KR&quot;, Arial, sans-serif' font-size="22" font-weight="800" fill="#2563EB" text-anchor="middle" letter-spacing="0">Execute</text>
<text x="1200" y="374" font-family='Inter, &quot;Noto Sans KR&quot;, Arial, sans-serif' font-size="15" font-weight="600" fill="#52525B" text-anchor="middle" letter-spacing="0">구현·테스트·수정</text>
<rect x="1000" y="562" width="320" height="96" rx="12" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1" filter="url(#shadow)"/>
<text x="1160" y="602" font-family='Inter, &quot;Noto Sans KR&quot;, Arial, sans-serif' font-size="22" font-weight="800" fill="#18181B" text-anchor="middle" letter-spacing="0">Review</text>
<text x="1160" y="634" font-family='Inter, &quot;Noto Sans KR&quot;, Arial, sans-serif' font-size="15" font-weight="600" fill="#52525B" text-anchor="middle" letter-spacing="0">코드·보안·UI 품질 검토</text>
<rect x="540" y="562" width="320" height="96" rx="12" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1" filter="url(#shadow)"/>
<text x="700" y="602" font-family='Inter, &quot;Noto Sans KR&quot;, Arial, sans-serif' font-size="22" font-weight="800" fill="#18181B" text-anchor="middle" letter-spacing="0">Verify</text>
<text x="700" y="634" font-family='Inter, &quot;Noto Sans KR&quot;, Arial, sans-serif' font-size="15" font-weight="600" fill="#52525B" text-anchor="middle" letter-spacing="0">빌드·테스트·브라우저 증거</text>
<rect x="500" y="302" width="320" height="96" rx="12" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1" filter="url(#shadow)"/>
<text x="660" y="342" font-family='Inter, &quot;Noto Sans KR&quot;, Arial, sans-serif' font-size="22" font-weight="800" fill="#18181B" text-anchor="middle" letter-spacing="0">Finish / Handoff</text>
<text x="660" y="374" font-family='Inter, &quot;Noto Sans KR&quot;, Arial, sans-serif' font-size="15" font-weight="600" fill="#52525B" text-anchor="middle" letter-spacing="0">문서·로그·다음 경로 기록</text>
<text x="930" y="468" font-family='Inter, &quot;Noto Sans KR&quot;, Arial, sans-serif' font-size="28" font-weight="800" fill="#7C3AED" text-anchor="middle" letter-spacing="0">통과하면 다음 Phase</text>
<text x="930" y="516" font-family='Inter, &quot;Noto Sans KR&quot;, Arial, sans-serif' font-size="28" font-weight="800" fill="#CA8A04" text-anchor="middle" letter-spacing="0">실패하면 Retry</text>
<rect x="340" y="746" width="1180" height="58" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
<text x="930" y="784" font-family='&quot;Fira Code&quot;, Consolas, &quot;Noto Sans Mono CJK KR&quot;, monospace' font-size="24" font-weight="800" fill="#2563EB" text-anchor="middle" letter-spacing="0">ready/isolate → execute → review → verify → finish/handoff</text>
</g>
</svg>
