<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="시작: 사용자는 무엇을 입력하나">
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/></filter>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M2,2 L8,5 L2,8 Z" fill="#2563EB"/></marker>
</defs>
<rect width="1600" height="900" fill="#FAFAFA"/>
<g transform="translate(-130 0)">
<text x="340" y="82" font-family='&quot;Plus Jakarta Sans&quot;, Inter, &quot;Noto Sans KR&quot;, sans-serif' font-size="42" font-weight="800" fill="#18181B" text-anchor="start" letter-spacing="0">시작: 사용자는 무엇을 입력하나</text>
<text x="342" y="122" font-family='Inter, &quot;Noto Sans KR&quot;, Arial, sans-serif' font-size="18" font-weight="500" fill="#6B7280" text-anchor="start" letter-spacing="0">사용자는 세부 스킬 대신 phase runner를 호출한다</text>
<rect x="340" y="190" width="610" height="94" rx="12" fill="#18181B" stroke="none" stroke-width="1"/>
<text x="374" y="230" font-family='&quot;Fira Code&quot;, Consolas, &quot;Noto Sans Mono CJK KR&quot;, monospace' font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">/moonshot-phase-runner</text>
<text x="374" y="262" font-family='Inter, &quot;Noto Sans KR&quot;, Arial, sans-serif' font-size="16" font-weight="500" fill="#D4D4D8" text-anchor="start" letter-spacing="0">안전한 plan을 찾고, 없으면 생성 후 실행</text>
<rect x="340" y="320" width="610" height="94" rx="12" fill="#18181B" stroke="none" stroke-width="1"/>
<text x="374" y="360" font-family='&quot;Fira Code&quot;, Consolas, &quot;Noto Sans Mono CJK KR&quot;, monospace' font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">/moonshot-phase-runner docs/implementation</text>
<text x="374" y="392" font-family='Inter, &quot;Noto Sans KR&quot;, Arial, sans-serif' font-size="16" font-weight="500" fill="#D4D4D8" text-anchor="start" letter-spacing="0">지정한 plan directory 실행</text>
<rect x="340" y="450" width="610" height="94" rx="12" fill="#18181B" stroke="none" stroke-width="1"/>
<text x="374" y="490" font-family='&quot;Fira Code&quot;, Consolas, &quot;Noto Sans Mono CJK KR&quot;, monospace' font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">/moonshot-phase-runner docs/implementation --autonomous</text>
<text x="374" y="522" font-family='Inter, &quot;Noto Sans KR&quot;, Arial, sans-serif' font-size="16" font-weight="500" fill="#D4D4D8" text-anchor="start" letter-spacing="0">질문 없이 현재 문서 기준으로 진행</text>
<rect x="340" y="606" width="610" height="86" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
<text x="374" y="640" font-family='Inter, &quot;Noto Sans KR&quot;, Arial, sans-serif' font-size="20" font-weight="800" fill="#CA8A04" text-anchor="start" letter-spacing="0">주의</text>
<text x="444" y="640" font-family='Inter, &quot;Noto Sans KR&quot;, Arial, sans-serif' font-size="22" font-weight="700" fill="#18181B" text-anchor="start" letter-spacing="0">계획만 원하면 --prepare-only를 명시</text>
<rect x="1040" y="190" width="360" height="72" rx="12" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1" filter="url(#shadow)"/>
<text x="1220" y="235" font-family='Inter, &quot;Noto Sans KR&quot;, Arial, sans-serif' font-size="22" font-weight="800" fill="#18181B" text-anchor="middle" letter-spacing="0">요청</text>
<path d="M 1220 268 L 1220 310" stroke="#2563EB" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1040" y="320" width="360" height="72" rx="12" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1" filter="url(#shadow)"/>
<text x="1220" y="365" font-family='Inter, &quot;Noto Sans KR&quot;, Arial, sans-serif' font-size="22" font-weight="800" fill="#18181B" text-anchor="middle" letter-spacing="0">Plan Directory 결정</text>
<path d="M 1220 398 L 1220 440" stroke="#2563EB" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1040" y="450" width="360" height="72" rx="12" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1" filter="url(#shadow)"/>
