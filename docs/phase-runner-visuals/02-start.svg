<path d="M 1220 528 L 1220 570" stroke="#2563EB" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1040" y="580" width="360" height="72" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
<text x="1220" y="625" font-family='Inter, &quot;Noto Sans KR&quot;, Arial, sans-serif' font-size="22" font-weight="800" fill="#2563EB" text-anchor="middle" letter-spacing="0">준비 후 실행 시작</text>
