<text x="342" y="122" font-family='Inter, &quot;Noto Sans KR&quot;, Arial, sans-serif' font-size="18" font-weight="500" fill="#6B7280" text-anchor="start" letter-spacing="0">큰 작업을 phase 단위로 끝까지 진행하는 Claude Code 실행 하네스</text>
