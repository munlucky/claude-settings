<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moonshot Phase Runner Visuals</title>
  <style>
    body { margin: 0; background: #FAFAFA; font-family: Inter, "Noto Sans KR", Arial, sans-serif; color: #18181B; }
    main { max-width: 1280px; margin: 0 auto; padding: 32px; }
    h1 { font-family: "Plus Jakarta Sans", Inter, sans-serif; font-size: 32px; }
    figure { margin: 0 0 32px; background: white; border: 1px solid #E4E4E7; border-radius: 8px; padding: 16px; }
    img { width: 100%; display: block; }
    figcaption { margin-top: 12px; color: #6B7280; font-size: 14px; }
  </style>
</head>
<body>
<main>
  <h1>Moonshot Phase Runner 사용자 워크플로우</h1>
  <figure><img src="01-overview.svg" alt="Moonshot Phase Runner 메인 흐름"><figcaption>1. Moonshot Phase Runner 메인 흐름</figcaption></figure>
  <figure><img src="02-start.svg" alt="시작: 사용자는 무엇을 입력하나"><figcaption>2. 시작: 사용자는 무엇을 입력하나</figcaption></figure>
  <figure><img src="03-artifacts.svg" alt="Phase Runner가 만드는 실행 아티팩트"><figcaption>3. Phase Runner가 만드는 실행 아티팩트</figcaption></figure>
  <figure><img src="04-phase-loop.svg" alt="각 Phase 안에서 도는 루프"><figcaption>4. 각 Phase 안에서 도는 루프</figcaption></figure>
  <figure><img src="05-exit-rules.svg" alt="언제 끝나고, 언제 계속하나"><figcaption>5. 언제 끝나고, 언제 계속하나</figcaption></figure>
  <figure><img src="06-status-board.svg" alt="사용자에게 보이는 상태판"><figcaption>6. 사용자에게 보이는 상태판</figcaption></figure>
</main>
</body>
</html>
