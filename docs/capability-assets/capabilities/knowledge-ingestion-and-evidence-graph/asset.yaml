  "problem": {
    "solves": [
      "서로 다른 source에서 온 signal을 검증 없이 memory로 승격하는 문제",
      "중복·충돌·민감 데이터가 knowledge store로 유입되는 문제"
    ],
    "does_not_solve": [
      "candidate 내용의 도메인 truth를 자동 판정하는 것",
      "review/commit authority를 대체하는 것"
    ]
  },
  "recommended_use": [
    "source provenance, evidence refs와 redaction 결과를 candidate에 바인딩한다.",
    "normalize → deduplicate → conflict → review 순서를 보존한다."
  ],
  "avoid_use": [
    "raw payload를 canonical knowledge로 저장하지 않는다.",
    "자동 candidate를 silent promotion하지 않는다."
  ],
  "authority": {
    "owns_state": [
      "ingestion transaction",
      "candidate/evidence graph",
      "redaction and conflict state"
    ],
    "owns_completion": [
      "knowledge candidate의 ingestion은 task completion을 소유하지 않는다."
    ],
    "provides_evidence": [
      "ingestion receipts",
      "candidate review and evidence binding tests"
    ]
  },
  "contracts": {
    "inputs": [
      "source signal",
      "project identity",
      "evidence refs",
      "redaction policy"
    ],
    "outputs": [
      "redacted normalized candidate",
      "dedup/conflict decision",
      "transaction receipt"
    ],
    "invariants": [
      "raw secret와 unscoped payload는 저장하지 않는다.",
      "candidate가 source/evidence 없이 canonical record가 되지 않는다."
    ],
    "guardrails": [
      "review/commit gate 유지",
      "project scope와 revision freshness 확인",
      "conflict는 fail-closed"
    ]
  },
