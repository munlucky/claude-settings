acceptedChanges:
  - ContextPackV1 is accepted only as an additive structured source object under projectKnowledgeContext.contextPack.
  - projectKnowledgeContext.promptBlock and existing top-level summary/status fields remain backward-compatible prompt-facing authority.
  - contextPackRef is a deterministic lineage id, not a file path.
  - blocking remains derived metadata; blocked is not added to the status enum.
  - strictness remains public authority; servingMode is metadata-only or derived.
  - runtimeAuthorityRef is stage-conditional so intake/plan stages can build context without active runId/goalId.
  - Phase 04 owns knowledge-context-build/context-pack/schema/consumer contract updates and compatibility fixtures.
  - Phase 08 treats ImprovementCandidateV1 as a trace-to-testcase candidate extension with no automatic source mutation.
  - Phase 09 treats task/day/week/month as promotion cadence and requires rollback to stale related contextPackRef projections.
rejectedChanges:
  - Replacing promptBlock with full raw context pack payload in worker prompts.
  - Copying raw MemoryGraph/KG/ontology records into plan, QA, handoff, or prompt documents.
  - Replacing strictness with servingMode as public contract.
  - Adding blocked as a new status enum value.
  - Letting eval PASS auto-edit schemas, ontology, skills, agents, tool permissions, or verification contracts.
  - Treating project knowledge, memory, or context packs as completion authority.
remainingAmbiguity:
  - Exact required/optional fields for ContextPackV1 still need schema-level design during Phase 04.
  - Parent must decide during implementation whether context-pack tests are standalone or folded into existing knowledge-context/context-state tests.
  - Agent contract updates should be checked with rg before Phase 04 implementation because project-memory and phase-attempt agents also describe projectKnowledgeContext shape.
