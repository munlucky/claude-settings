independentReviewPerspectives:
  - id: source-scope-preservation
    verdict: reject_v1_as_final_plan
    findings:
      - "The source reports include Context State Engine, Tool Registry/Dispatcher, Sandbox Compute Plane, Eval Regression Gate, trace-to-testcase, prompt caching, memory promotion, observability, CI/security, and packaging/account-root rollout."
      - "The v1 implementation trace mainly closes Runtime Control Plane and Completion Authority foundation."
      - "A foundation implementation can be valuable, but it cannot be represented as full modernization completion."
  - id: runtime-architecture
    verdict: require_v2_dependency_and_lifecycle_phases
    findings:
      - "Native dependency delivery and installed account-root availability remain separate from source-level SQLite support."
      - "Run identity hardening needs heartbeat, TTL, stale lease cleanup, and operations visibility before N:N concurrent work is complete."
      - "Context state, tool dispatch, and sandbox compute boundaries require dedicated implementation phases."
  - id: verification-security-eval
    verdict: require_full_eval_and_security_gates
    findings:
      - "False-completion regressions are necessary but not enough for full eval modernization."
      - "AWTL replay, trace-to-testcase, browser trace isolation, dependency review, CodeQL, branch protection, and security status consumption must remain in scope."
      - "Unauthorized approval-required operations must be runtime blockers and eval fixtures."
  - id: operations-rollout
    verdict: require_account_root_and_metrics_hardening
    findings:
      - "Package dry-run success does not prove installed native dependency availability."
      - "GitHub branch protection is not represented by source files alone."
      - "Operations metrics and degraded-state runbooks are required to avoid silent authority drift."
blockingFindings:
  - id: reject-v1-final-scope
    severity: reject
    statement: "v1 cannot be treated as the final harness modernization plan because it narrows the full source reports to Wave 1 control-plane foundation."
  - id: missing-v2-phase-scope
    severity: reject
    statement: "The final plan must include explicit phases for context, tool dispatcher, sandbox compute plane, eval/trace, memory, CI/security operations, packaging/account-root, and observability."
acceptedCorrections:
