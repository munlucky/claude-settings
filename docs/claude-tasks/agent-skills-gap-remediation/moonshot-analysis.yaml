schemaVersion: "1.0"

workflowEvidence:
  mode: "bounded-direct"
  selectedBundles:
    - "analysis-bundle"
    - "ready-isolate-bundle"
    - "implementation-bundle"
    - "review-bundle"
    - "verification-bundle"
    - "finish-bundle"
  requiredSkills:
    - "implementation-runner"
    - "codex-review-code"
    - "code-simplifier"
    - "completion-verifier"
    - "doc-auto-sync"
    - "session-logger"
  stageOrder:
    - "plan"
    - "ready/isolate"
    - "execute"
    - "review"
    - "verify"
    - "finish/handoff"
  appliedSkills:
    - "implementation-runner"
    - "codex-review-code"
    - "code-simplifier"
    - "completion-verifier"
    - "doc-auto-sync"
  skippedSkills:
    - "session-logger (clean completion path)"
  evidenceFiles:
    analysisContext: ".claude/docs/tasks/agent-skills-gap-remediation/moonshot-analysis.yaml"
    sprintContract: ".claude/docs/tasks/agent-skills-gap-remediation/execution/04-proposer-and-benchmark-loop/SPRINT_CONTRACT.md"
    qaReport: ".claude/docs/tasks/agent-skills-gap-remediation/execution/04-proposer-and-benchmark-loop/QA_REPORT.md"
    handoff: ".claude/docs/tasks/agent-skills-gap-remediation/execution/04-proposer-and-benchmark-loop/HANDOFF.md"
readiness:
  planningReady: true
  executionReady: true
  planningBasis: "workflow-selection"
  executionBasis: "bounded-artifacts-resolved"
  phaseAttemptOverride: false
completionModel:
  state: "complete"
  closeoutStatus: "clean_finish"
  currentStage: "finish/handoff"
  blockers: []
