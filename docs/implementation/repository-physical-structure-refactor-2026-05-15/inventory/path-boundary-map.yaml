schemaVersion: 1
phase: P01
sourceEvidence:
  findDirs: docs/implementation/repository-physical-structure-refactor-2026-05-15/evidence/p01-find-claude-dirs.txt
  firstLevelScan: find .claude -maxdepth 1 -mindepth 1 | sort
classificationVocabulary:
  - canonical_source
  - dev_profile
  - generated_state
  - package_output
  - fixture_or_test
  - public_doc
  - deprecated_history
coverageRule: "Each first-level .claude path is represented either by exact path or by the explicit topLevelFilePatterns section."

firstLevelPaths:
  - path: .claude/agents
    primaryClass: canonical_source
    packageIntent: move_to_package_source
    migrationDecision: "Canonical agent definitions; relocate into the package/source layout in later phases."
  - path: .claude/bin
    primaryClass: package_output
    packageIntent: generated_or_installed_payload
    migrationDecision: "CLI shims belong to the install/package materialization boundary, not runtime state."
  - path: .claude/browser-artifacts
    primaryClass: generated_state
    packageIntent: exclude_from_package
    migrationDecision: "Browser run outputs; keep ignored and outside package payloads."
  - path: .claude/browser-runtime
    primaryClass: generated_state
    packageIntent: exclude_from_package
    migrationDecision: "Local browser runtime materialization; keep ignored and outside package payloads."
  - path: .claude/cache
    primaryClass: generated_state
    packageIntent: exclude_from_package
    migrationDecision: "Runtime cache; keep ignored and outside package payloads."
  - path: .claude/CLAUDE.ko.md
    primaryClass: dev_profile
    packageIntent: repository_profile
    migrationDecision: "Repository-local Korean runtime profile; retain as dev profile unless later localized packaging is approved."
  - path: .claude/CLAUDE.md
    primaryClass: dev_profile
    packageIntent: repository_profile
    migrationDecision: "Active workspace contract for this repository; retain as dev profile."
  - path: .claude/code-policy-baseline.txt
    primaryClass: fixture_or_test
    packageIntent: regression_input
    migrationDecision: "Baseline consumed by policy verification; keep with test/verification fixtures."
  - path: .claude/config
    primaryClass: dev_profile
    packageIntent: repository_profile
    migrationDecision: "Repository runtime configuration; keep out of canonical package source unless a later phase promotes specific defaults."
  - path: .claude/docs
    primaryClass: public_doc
    packageIntent: split_public_docs_from_runtime_docs
    migrationDecision: "Guidelines/reference docs should move or mirror under docs/package docs; execution/task state remains non-package."
  - path: .claude/logs
    primaryClass: generated_state
    packageIntent: exclude_from_package
    migrationDecision: "Runtime logs; keep ignored and outside package payloads."
  - path: .claude/memory.json
    primaryClass: generated_state
    packageIntent: exclude_from_package
    migrationDecision: "Runtime memory state; keep ignored and outside package payloads."
  - path: .claude/memorygraph
    primaryClass: generated_state
    packageIntent: exclude_from_package
    migrationDecision: "Runtime graph state; keep ignored and outside package payloads."
  - path: .claude/PROJECT.ko.md
    primaryClass: dev_profile
    packageIntent: repository_profile
    migrationDecision: "Repository-local Korean project memory/profile; retain as dev profile."
  - path: .claude/PROJECT.md
    primaryClass: dev_profile
    packageIntent: repository_profile
    migrationDecision: "Repository project memory/profile; retain as dev profile."
  - path: .claude/README.ko.md
    primaryClass: public_doc
    packageIntent: documentation
    migrationDecision: "Public-facing Korean README content; keep with docs/package documentation after source split."
  - path: .claude/README.md
    primaryClass: public_doc
    packageIntent: documentation
    migrationDecision: "Public-facing README content; keep with docs/package documentation after source split."
  - path: .claude/rules
    primaryClass: canonical_source
    packageIntent: move_to_package_source
    migrationDecision: "Canonical policy source; relocate into package/source layout in later phases."
  - path: .claude/runtime-state.sqlite
    primaryClass: generated_state
    packageIntent: exclude_from_package
    migrationDecision: "SQLite runtime state; keep ignored with sqlite sidecars."
  - path: .claude/schemas
    primaryClass: canonical_source
    packageIntent: move_to_package_source
    migrationDecision: "Canonical schema source; relocate into package/source layout in later phases."
  - path: .claude/scripts
    primaryClass: canonical_source
    packageIntent: move_to_package_source
    migrationDecision: "Canonical script source; relocate into package/source layout in later phases, with fixtures split as fixture_or_test."
  - path: .claude/skills
    primaryClass: canonical_source
    packageIntent: move_to_package_source
    migrationDecision: "Canonical skill source; relocate into package/source layout in later phases."
  - path: .claude/skills-archive
    primaryClass: deprecated_history
    packageIntent: exclude_by_default
    migrationDecision: "Deprecated skill history; retain for history but do not install by default."
  - path: .claude/templates
    primaryClass: canonical_source
    packageIntent: move_to_package_source
    migrationDecision: "Canonical template source; relocate into package/source layout in later phases."
  - path: .claude/tests
    primaryClass: fixture_or_test
    packageIntent: test_source
    migrationDecision: "Regression tests and fixtures; keep with test layout, not runtime payload."
  - path: .claude/tmp
    primaryClass: generated_state
    packageIntent: exclude_from_package
    migrationDecision: "Temporary runtime workspace; add or preserve ignore/package exclusion."
  - path: .claude/tools
    primaryClass: package_output
    packageIntent: generated_or_vendor_payload
    migrationDecision: "Tool materialization/vendor payload such as browserd dependencies; exclude generated dependencies and define package install boundary later."
  - path: .claude/traces
    primaryClass: generated_state
    packageIntent: exclude_from_package
    migrationDecision: "Runtime traces; keep ignored and outside package payloads."
  - path: .claude/verification.contract.yaml
    primaryClass: canonical_source
    packageIntent: move_to_package_source
    migrationDecision: "Canonical verification contract; relocate into package/source layout in later phases."

topLevelFilePatterns:
  - pattern: .claude/*verdict*.json
    primaryClass: generated_state
    packageIntent: exclude_from_package
    migrationDecision: "Structured runtime verification/browser/visual verdicts; keep ignored and outside package payloads."
  - pattern: .claude/knowledge-repo-audit-*.json
    primaryClass: generated_state
    packageIntent: exclude_from_package
    migrationDecision: "Knowledge repository audit output; keep ignored and outside package payloads."
  - pattern: .claude/runtime-state.sqlite*
    primaryClass: generated_state
    packageIntent: exclude_from_package
    migrationDecision: "SQLite runtime state and sidecars; keep ignored and outside package payloads."

subtreeOverrides:
  - path: .claude/scripts/fixtures
    primaryClass: fixture_or_test
    parentPrimaryClass: canonical_source
    migrationDecision: "Script fixtures move with tests/fixtures, not executable source."
  - path: .claude/tests/fixtures
    primaryClass: fixture_or_test
    parentPrimaryClass: fixture_or_test
    migrationDecision: "Regression fixtures remain test-only."
  - path: .claude/docs/tasks
    primaryClass: generated_state
    parentPrimaryClass: public_doc
    migrationDecision: "Task state is repository runtime/planning state; do not package as public docs."
  - path: .claude/docs/reports
    primaryClass: generated_state
    parentPrimaryClass: public_doc
    migrationDecision: "Generated reports stay ignored/runtime-only."
  - path: .claude/tools/browserd/node_modules
    primaryClass: generated_state
    parentPrimaryClass: package_output
    migrationDecision: "Installed dependencies are generated package output and must not be committed or packaged as source."

generatedStateIgnoreCoverage:
  existingRules:
    - .claude/browser-runtime/
    - .claude/browser-artifacts/
    - .claude/cache/
    - .claude/logs
    - .claude/traces/
    - .claude/runtime-state.sqlite*
    - .claude/memory.json
    - .claude/memorygraph/
    - .claude/knowledge-repo-audit-*.json
    - .claude/verification-verdict-*.json
    - .claude/runtime-verdict-*.json
    - .claude/browser-flow-verdict-*.json
    - .claude/visual-diff-verdict-*.json
    - .code-review-graph/
  proposedRules:
    - .claude/tmp/
    - .claude/tools/browserd/node_modules/
