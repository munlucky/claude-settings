planQualityReview:
  schemaVersion: 1
  iteration: 1
  isolationMode: "forked"
  reviewerSession: "codex-isolated-reviewer-agent-2026-05-15"
  skillBoundary:
    allowed:
      - "plan-eng-review"
      - "plan-ceo-review"
      - "product-gate-reviewer"
      - "codex-validate-plan"
      - "verification-contract-gate"
      - "context-readiness-gate"
      - "test-driven-development"
      - "design-approval-gate"
      - "browser-verifier"
    forbidden:
      - "moonshot-plan-writer"
      - "moonshot-phase-runner"
      - "moonshot-orchestrator"
      - "implementation-runner"
      - "doc-auto-sync"
      - "task-slicer"
      - "assumption-ledger"
      - "commit-moonshot"
      - "project-memory-refresh"
      - "harness-memory-promoter"
    compliance: "compliant"
    notes:
      - "Read-only review only; no files modified."
      - "Review inspected target plan package files and fixed rubric text; no forbidden workflow skill was invoked."
  targetPlanPackage:
    planDir: "docs/implementation/repository-physical-structure-refactor-2026-05-15"
    masterPlan: "docs/implementation/repository-physical-structure-refactor-2026-05-15/00-master-plan-v1.md"
    phaseDocs:
      - "docs/implementation/repository-physical-structure-refactor-2026-05-15/01-source-boundary-inventory-v1.md"
      - "docs/implementation/repository-physical-structure-refactor-2026-05-15/02-canonical-layout-package-contract-v1.md"
      - "docs/implementation/repository-physical-structure-refactor-2026-05-15/03-dev-only-claude-profile-v1.md"
      - "docs/implementation/repository-physical-structure-refactor-2026-05-15/04-installer-plugin-materialization-v1.md"
      - "docs/implementation/repository-physical-structure-refactor-2026-05-15/05-runtime-state-extraction-v1.md"
      - "docs/implementation/repository-physical-structure-refactor-2026-05-15/06-compatibility-migration-docs-v1.md"
  rubric:
    goalClarity:
      weight: 0.20
      score: 0.88
      evidence:
        - "00-master-plan-v1.md / Problem Statement defines the self-referential `.claude/` source, dev-context, and runtime-state problem."
        - "00-master-plan-v1.md / Objective states the target outcome: canonical harness source outside `.claude/`, thin wrappers, and generated state excluded from distributable source."
        - "00-master-plan-v1.md / Requirements maps REQ-1 through REQ-7 to the migration goal."
      findings:
        - "The top-level migration goal is clear and tied to explicit requirements."
        - "Goal Contract Readiness still marks `strictRunnableReadiness: false`, so the package truthfully does not claim executable readiness yet."
    scopeClarity:
      weight: 0.20
      score: 0.74
      evidence:
        - "00-master-plan-v1.md / Non-Goals excludes removing Claude Code support, rewriting Moonshot workflow semantics, deleting history, and plugin-only installation."
        - "00-master-plan-v1.md / Stable Boundary Rules distinguishes canonical source, dev dogfood profile, runtime wrapper, generated state, installer output, and compatibility."
        - "01-source-boundary-inventory-v1.md / Scope lists `.claude/skills/`, `.claude/agents/`, `.claude/rules/`, `.claude/scripts/`, `.claude/schemas/`, `.claude/templates/`, `.claude/docs/`, runtime artifact paths, and verdict JSON."
      findings:
        - "The conceptual scope is strong, but the phase docs do not declare exact `ownedPaths` versus read-only/dependent paths."
        - "Parallel-safety claims in 00-master-plan-v1.md / Parallel Execution Plan depend on a future ownership table rather than current phase-level path ownership."
    acceptanceCriteriaClarity:
      weight: 0.20
      score: 0.68
      evidence:
        - "00-master-plan-v1.md / Acceptance Criteria defines AC-01 through AC-07 with evidence targets such as `node --test tests/package-layout.test.mjs`, `bash install-claude.sh --dry-run`, and `.claude/scripts/knowledge-repo-audit.sh`."
        - "01-source-boundary-inventory-v1.md / Acceptance Criteria requires every first-level `.claude/` path to have one primary class and every generated-state class to have an ignore rule or proposed rule."
        - "06-compatibility-migration-docs-v1.md / Acceptance Criteria requires no unresolved hard-coded source-of-truth references to `.claude/`."
      findings:
        - "Master ACs are testable, but phase docs use unnumbered acceptance bullets and do not map each bullet back to AC-01 through AC-07."
        - "No phase doc defines per-task acceptance IDs, evidence artifact paths, or owner-visible stop conditions."
    verificationClarity:
      weight: 0.20
      score: 0.62
      evidence:
        - "00-master-plan-v1.md / Verification Plan lists `node --test tests/package-layout.test.mjs`, `node --test tests/plugin-manifest.test.mjs`, `node --test tests/package-materialization.test.mjs`, `node --test tests/migration-audit.test.mjs`, `bash install-claude.sh --dry-run`, `.claude/scripts/knowledge-repo-audit.sh`, and `git diff --check`."
        - "04-installer-plugin-materialization-v1.md / Verification includes Windows validation command `.\\install-claude.ps1 -DryRun`."
        - "05-runtime-state-extraction-v1.md / Verification includes `node --test tests/package-materialization.test.mjs --test-name-pattern \"excludes runtime state\"` and `node --test tests/migration-audit.test.mjs`."
      findings:
        - "Commands are named, but phase docs omit expected signals such as exact pass/fail output, generated evidence filenames, and where dry-run output should be saved."
        - "Windows validation is required but lacks blocker conditions for unavailable Windows/PowerShell validation environment."
    brownfieldReadiness:
      weight: 0.10
      score: 0.70
      evidence:
        - "00-master-plan-v1.md / Source Baseline names README.md, .claude/README.md, .claude/CLAUDE.md, .gitignore, and docs/analysis/ouroboros-harness-adoption-inventory.md."
        - "00-master-plan-v1.md / Runnable Preparation Gate prohibits rewriting `.claude/docs/phase-status.yaml` as part of this planning package."
        - "01-source-boundary-inventory-v1.md / Verification includes `rg -n \"\\.claude/\" README.md AGENTS.md docs .claude install-claude.sh install-claude.ps1`."
      findings:
        - "The plan recognizes brownfield path risk and active runtime context risk."
        - "It does not yet include a captured current inventory, hard-coded path baseline, or compatibility impact table as plan evidence."
    phaseExecutability:
      weight: 0.10
      score: 0.42
      evidence:
        - "All phase docs 01 through 06 contain Objective, scope/deliverables or target behavior, Acceptance Criteria, and Verification sections."
        - "No phase doc contains a `Phase Execution Metadata` section."
        - "No phase doc contains exact `ownedPaths`."
        - "No phase doc contains a task breakdown with task IDs, critical scenarios, blocker conditions, expected signals, or evidence paths."
      findings:
        - "The phase package is directionally useful but not yet strict runnable input."
        - "The missing execution metadata is cross-cutting across all six phase docs and blocks safe handoff to an implementation runner."
  totalScore: 0.70
  ambiguityScore: 0.30
  decision: "revise"
  blockingFindings:
    - id: "BF-01"
      severity: "high"
      finding: "All phase docs lack required Phase Execution Metadata."
      evidence:
        - "01-source-boundary-inventory-v1.md through 06-compatibility-migration-docs-v1.md have no `Phase Execution Metadata` section."
      impact: "A runner cannot determine phase dependencies, concurrency rules, mutation boundaries, rollback expectations, or evidence output requirements from phase-local metadata."
    - id: "BF-02"
      severity: "high"
      finding: "All phase docs lack exact ownedPaths."
      evidence:
        - "00-master-plan-v1.md / Parallel Execution Plan says Phase 03 and Phase 05 may run in conditional parallel only if ownership is separated."
        - "01-source-boundary-inventory-v1.md through 06-compatibility-migration-docs-v1.md do not declare owned paths."
      impact: "The plan cannot safely support sequential or conditional-parallel execution without path ownership and conflict declarations."
    - id: "BF-03"
      severity: "high"
      finding: "Phase docs lack task breakdowns, critical scenarios, blocker conditions, expected signals, and evidence paths."
      evidence:
        - "Phase docs 01 through 06 include Verification command blocks but no task IDs, critical scenario matrix, blocker condition list, expected command signals, or evidence artifact locations."
      impact: "Implementation agents would need to infer execution steps and completion evidence, increasing migration risk in an active `.claude` dogfood repository."
  improvementDirectives:
    - id: "DIR-01"
      priority: "P0"
      directive: "Add `Phase Execution Metadata` to every phase doc with phase id, dependencies, allowed mutation type, exact ownedPaths, read-only reference paths, blocked paths, rollback rule, required evidence paths, and phase completion condition."
    - id: "DIR-02"
      priority: "P0"
      directive: "Add a task breakdown to every phase using stable task IDs, each mapped to AC-01 through AC-07 where applicable, with exact files to edit or generate and exact verification command(s)."
    - id: "DIR-03"
      priority: "P0"
      directive: "For Phase 01, define evidence paths and expected contents for inventory outputs; include blocker conditions for unclassified first-level `.claude/` paths and unresolved hard-coded `.claude/` source-of-truth references."
    - id: "DIR-04"
      priority: "P0"
      directive: "For Phase 02, declare ownedPaths for canonical directories and contract files; define blocker conditions for duplicate long-lived source, unsupported symlink behavior, and missing package-contract entries."
    - id: "DIR-05"
      priority: "P0"
      directive: "For Phase 03, list exact `.claude/` ownedPaths and protected active-runtime paths; define critical scenarios for preserving current agent usability while preventing canonical-source drift."
    - id: "DIR-06"
      priority: "P0"
      directive: "For Phase 04, add task-level evidence paths for installer dry-run output, plugin manifest validation, and package materialization results; define blocker conditions for invalid JSON, missing manifest paths, downstream overwrite risk, and unavailable Windows dry-run validation."
    - id: "DIR-07"
      priority: "P0"
      directive: "For Phase 05, select `.moonshot-state/` or `.claude/state/` before execution or make that an explicit pre-execution decision gate; list exact state resolver files, `.gitignore` entries, migration audit outputs, expected signals, and cleanup-guide evidence."
    - id: "DIR-08"
      priority: "P0"
      directive: "For Phase 06, add exact documentation ownedPaths, compatibility wrapper ownedPaths, final closeout evidence filenames, and blocker conditions for unresolved `.claude/` source-of-truth references, failed knowledge audit, or missing deprecation-window notes."
    - id: "DIR-09"
      priority: "P1"
      directive: "Update the master Plan Quality Loop after revision to cite this review iteration and keep `strictRunnableReadiness: false` until all P0 directives are addressed and a subsequent review returns pass or conditional_pass."
    - id: "DIR-10"
      priority: "P1"
      directive: "Add a phase-to-AC matrix that maps each phase-local task or acceptance item to AC-01 through AC-07 and names the evidence command and evidence path for each AC."
