planQualityReview:
  schemaVersion: 1
  iteration: 3
  isolationMode: "forked"
  reviewerSession: "codex-reviewer-agent-iter-03-2026-05-29"
  skillBoundary:
    allowed:
      - "plan-eng-review"
      - "plan-ceo-review"
