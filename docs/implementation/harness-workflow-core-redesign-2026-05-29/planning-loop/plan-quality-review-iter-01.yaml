planQualityReview:
  schemaVersion: 1
  iteration: 1
  isolationMode: "forked"
  reviewerSession: "codex-reviewer-agent-2026-05-29"
  skillBoundary:
    allowed:
      - "plan-eng-review"
      - "plan-ceo-review"
      - "product-gate-reviewer"
      - "codex-validate-plan"
      - "verification-contract-gate"
      - "context-readiness-gate"
      - "test-driven-development"
      - "design-approval-gate"
      - "browser-verifier"
    forbidden:
      - "moonshot-plan-writer"
      - "moonshot-phase-runner"
      - "moonshot-orchestrator"
      - "implementation-runner"
      - "doc-auto-sync"
      - "task-slicer"
      - "assumption-ledger"
      - "commit-moonshot"
      - "project-memory-refresh"
      - "harness-memory-promoter"
    compliance: "compliant"
    notes:
      - "Read-only review only; no files modified."
      - "No forbidden implementation, writer, commit, memory, or orchestration skills were invoked."
      - "Evidence inspection was limited to the target master plan, plan package directory inventory, and git status."
  targetPlanPackage:
    planDir: "docs/implementation/harness-workflow-core-redesign-2026-05-29"
    masterPlan: "docs/implementation/harness-workflow-core-redesign-2026-05-29/00-master-plan-v1.md"
    phaseDocs: []
  rubric:
    goalClarity:
      weight: 0.20
      score: 0.86
      evidence:
        - "00-master-plan-v1.md:5-14 defines workflow control-plane redesign goal and five success criteria."
        - "00-master-plan-v1.md:67-148 defines target architecture components."
        - "00-master-plan-v1.md:270-281 identifies the recommended first implementation slice."
      findings:
        - "Goal is directionally strong and correctly rejects superficial SKILL.md line-count reduction."
        - "End-state thresholds are still incomplete for state-board authority, evidence class adoption, and runtime taxonomy rollout."
    scopeClarity:
      weight: 0.20
      score: 0.72
      evidence:
        - "00-master-plan-v1.md:150-156 lists non-goals."
        - "00-master-plan-v1.md:158-242 defines five phases."
        - "00-master-plan-v1.md:244-254 defines small vertical-slice execution strategy."
      findings:
        - "Scope is coherent at architecture level."
        - "Phase scopes do not yet include ownedPaths, readOnlyPaths, sharedMutablePaths, or explicit excluded surfaces."
        - "Current dirty worktree is not classified, so brownfield edit ownership is not ready for runner dispatch."
    acceptanceCriteriaClarity:
      weight: 0.20
      score: 0.55
      evidence:
        - "00-master-plan-v1.md:171-174 lists Phase 1 acceptance criteria."
        - "00-master-plan-v1.md:186-189 lists Phase 2 acceptance criteria."
        - "00-master-plan-v1.md:202-205 lists Phase 3 acceptance criteria."
        - "00-master-plan-v1.md:224-227 lists Phase 4 acceptance criteria."
        - "00-master-plan-v1.md:239-242 lists Phase 5 acceptance criteria."
      findings:
        - "Each phase has acceptance bullets, but they are not stable AC-* ids."
        - "Acceptance criteria lack source labels, evidence targets, expected pass signals, and traceability rows."
        - "No master source traceability matrix maps root causes or success criteria to phase acceptance criteria."
    verificationClarity:
      weight: 0.20
      score: 0.67
      evidence:
        - "00-master-plan-v1.md:171-174 names concrete Phase 1 commands."
        - "00-master-plan-v1.md:256-268 lists required per-phase and workflow-core verification commands."
      findings:
        - "Verification commands are present and mostly concrete."
        - "The matrix uses placeholders such as node --check <changed-script> and targeted node --test <new-or-neighbor-test> without phase-specific file targets."
        - "Expected failing signals, passing signals, blocker conditions, and evidence output paths are missing."
        - "No dry-run readiness command is specified for plan package preparation."
    brownfieldReadiness:
      weight: 0.10
      score: 0.54
      evidence:
        - "00-master-plan-v1.md:16-23 captures bottleneck audit baseline metrics."
        - "00-master-plan-v1.md:181-184 references existing state-board/closeout integration surfaces."
        - "00-master-plan-v1.md:256-268 references existing verification scripts."
        - "Plan package directory contains only 00-master-plan-v1.md and no phase documents."
        - "git status shows existing modified and untracked harness files, including .claude scripts, skill docs, verification contract, and this plan package."
      findings:
        - "Plan is grounded in current harness surfaces and audit output."
        - "It does not inventory current scripts, contracts, runtime pointers, root phase docs, closeout artifacts, or stale execution state."
        - "Dirty-path ownership classification is absent, which blocks safe brownfield execution."
    phaseExecutability:
      weight: 0.10
      score: 0.45
      evidence:
        - "00-master-plan-v1.md:158-242 defines phase sequence and deliverables."
        - "00-master-plan-v1.md:244-254 defines vertical-slice sequencing."
        - "00-master-plan-v1.md:270-281 recommends a first implementation slice."
        - "Target package has no NN-* phase files and no phaseExecution metadata blocks."
      findings:
        - "The first slice is plausible and low-risk."
        - "Phases are not independently executable session plans."
        - "Missing phase docs, phaseExecution metadata, ownedPaths, exact tasks, evidence paths, and blocker conditions prevent strict runnable readiness."
  totalScore: 0.66
  ambiguityScore: 0.34
  decision: "revise"
  blockingFindings:
    - "Strict runnable readiness is blocked because the package has no standalone NN-* phase documents and no phaseExecution metadata."
    - "Strict runnable readiness is blocked because no AC-* traceability matrix links goals, root causes, phase acceptance criteria, commands, and evidence targets."
    - "Strict runnable readiness is blocked because current dirty worktree paths are not classified before brownfield edits."
    - "Strict runnable readiness is blocked because Plan Package Readiness Closeout is absent: no stale root doc inventory, runtime pointer action, dry-run command, or readinessDecision."
  improvementDirectives:
    - "Add a Plan Package Readiness Closeout section with planPackageReadiness.mode, selected master plan, selected phase docs, stale root docs, stale master plans, dirtyWorktreeAction, runtimePointerAction, dryRunCommand, and readinessDecision."
    - "Create standalone phase documents for at least Phase 1 and the required readiness phase if cleanup/classification is needed before implementation."
    - "Add phaseExecution metadata to each phase with ownedPaths, readOnlyPaths, sharedMutablePaths, dependsOn, conflictsWith, parallelEligible, and mergePolicy."
    - "Convert phase acceptance bullets into stable AC-* ids with source labels, expected evidence, expected pass signals, and target phase mapping."
    - "Add a source traceability matrix mapping root causes, success criteria, AC-* ids, phases, plan files, and status."
    - "Replace generic verification placeholders with phase-specific commands, expected fail/pass signals, blocker conditions, review checkpoints, and evidence paths."
    - "Add a dirty worktree classification table requirement for every current git status path and make any unknown owner block implementation phases."
    - "Define the first slice as an executable phase with exact files to create or modify: workflow registry, registry loader, tests, and harness bottleneck audit wiring."
