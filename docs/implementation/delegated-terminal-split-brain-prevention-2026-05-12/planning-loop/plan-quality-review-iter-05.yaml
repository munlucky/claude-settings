      observation: "allowed:false with completed-timing-stage-not-terminal, plan-conformance-not-passed, incomplete_attempt_manifest, master-checklist-not-checked, artifact_path_missing, atomic-tasks-incomplete, verification-verdict-inconsistent, verification-verdict-not-passed, latest-dispatch-failed-phase-completed, and non-strict MemoryGraph degradedEvidence."
    - source: "live command: node .claude/scripts/prepare-implementation-plan-state.mjs --dry-run --plan-dir docs/implementation/delegated-terminal-split-brain-prevention-2026-05-12 --master-plan docs/implementation/delegated-terminal-split-brain-prevention-2026-05-12/00-master-plan-v1.md --status-file .claude/docs/phase-status.yaml --execution-root docs/implementation/delegated-terminal-split-brain-prevention-2026-05-12/execution/v1"
