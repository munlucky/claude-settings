      observation: "phase-status points to the same master plan and execution root but projects activeCompletedPhases 7, activeRemainingPhases 0, lastStopReasonCode scope_complete, and lastExecutionStatus finished."
    - source: ".claude/docs/phase-status.yaml:32-57"
      observation: "recoveredBlockers include runtime_unavailable, dirty_worktree, and upstream_not_synced closeout history."
