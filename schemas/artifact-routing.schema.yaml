schema:
  name: artifactRouting
  version: "1.0"
  purpose: "Evidence contract for output destination decisions."

artifactRouting:
  responseMode:
    allowed:
      - inline
      - task_artifact
      - runtime_artifact
      - downloadable_file
  reason: ""
  outputRoot:
    sourceOwned: ""
    runtimeOwned: ""
  forbidden:
    - ".claude/** durable source"
    - ".codex/** durable source"
    - "raw MemoryGraph records in durable source"
    - "raw runtime logs in package payload"
    - "raw transcripts in research notes"
    - "browser artifacts in source templates"
    - "secrets in research or prototype evidence"

rules:
  - "Durable source belongs in canonical source directories."
  - "Generated evidence belongs in runtime state, not package payload."
  - "Research and prototype evidence must store compact summaries and pointers, not raw private/runtime payloads."
