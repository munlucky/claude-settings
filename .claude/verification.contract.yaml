commands:
  knowledgeAudit: "bash .claude/scripts/knowledge-repo-audit.sh"
  codePolicy: "bash .claude/scripts/verify-code-policy.sh"
  workflowEnforcement: "bash .claude/scripts/workflow-enforcement.sh verify"
  shellSyntax: "bash -n .claude/scripts/knowledge-repo-audit.sh && bash -n .claude/scripts/verify-code-policy.sh && bash -n .claude/scripts/workflow-enforcement.sh && bash -n .claude/scripts/agent-loop.sh && bash -n .claude/scripts/moonshot-phase-dispatch.sh && bash -n .claude/scripts/phase-worktree-coordinator.sh && bash -n .claude/scripts/verify-phase-runtime-parity.sh && bash -n .claude/scripts/verify-phase-runner-boundary.sh && bash -n .claude/agents/verification/verify-changes.sh && bash -n .claude/agents/verification/verify-runtime.sh"
  phaseRuntimeParity: "bash .claude/scripts/verify-phase-runtime-parity.sh .claude/docs/runtime-parity-reference-plan"
  phaseRunnerBoundary: "bash .claude/scripts/verify-phase-runner-boundary.sh"
  phaseWorktreeParallel: "node .claude/scripts/phase-worktree-coordinator.mjs self-test"
  phaseCloseout: "node .claude/scripts/verify-phase-closeout.mjs --status-file .claude/docs/phase-status.yaml --plan-dir docs/implementation --master-plan docs/implementation/00-master-plan-v1.md"
checkPolicies:
  searchEvidence:
    preferred: rg
    windowsFallback: Select-String
    exactRequired: false
    fallbackStatus: passed_with_equivalent_evidence
  phaseRuntimeParity:
    runtimeSelectionAware: true
    defaultVerificationRuntimes:
      auto: current
      current: current
      claude: claude
      codex: codex
      both: both
    commandEnv:
      PHASE_RUNTIME_PARITY_TARGET_RUNTIMES: "{verificationTarget}"
    preflightBlockOnUnavailable: true
  validationProfiles:
    prompt_only:
      checks: [knowledgeAudit, shellSyntax]
      minimumEvidence: "static contract and knowledge audit"
    docs_only:
      checks: [knowledgeAudit, shellSyntax]
      minimumEvidence: "documentation and template syntax integrity"
    script_change:
      checks: [shellSyntax, codePolicy]
      minimumEvidence: "syntax plus targeted self-test when available"
    workflow_core:
      checks: [knowledgeAudit, codePolicy, workflowEnforcement, phaseRunnerBoundary, phaseWorktreeParallel]
      minimumEvidence: "cross-runtime workflow contract evidence"
    runtime_adapter:
      checks: [workflowEnforcement, phaseRuntimeParity, phaseRunnerBoundary, phaseCloseout]
      minimumEvidence: "Codex and Claude runtime boundary parity"
  crossRuntimePhaseReplay:
    required: true
    assistantItemPhaseValues:
      - commentary
      - final_answer
    rule: "Preserve assistant phase values when replaying assistant items; never add phase to user messages."
scope:
  executionPlanes:
    - meta_harness
  paths:
    - "AGENTS.md"
    - ".claude/CLAUDE.md"
    - ".claude/rules/**"
    - ".claude/skills/**"
    - ".claude/skills-archive/**"
    - ".claude/agents/**"
    - ".claude/PROJECT.md"
    - ".claude/PROJECT.ko.md"
    - ".claude/README.md"
    - ".claude/README.ko.md"
    - ".claude/docs/guidelines/**"
    - ".claude/docs/reference-downstream/**"
    - ".claude/docs/runtime-parity-reference-plan/**"
    - ".claude/docs/ko/rules/**"
    - ".claude/templates/execution/**"
    - ".claude/scripts/**"
    - ".claude/verification.contract.yaml"
    - ".claudeignore"
    - ".gitignore"
    - "README.md"
    - "docs/claude-tasks/external-harness-adoption/**"
    - "install-claude.sh"
  fallbackOutsideScope: true
artifacts:
  verdict: ".claude/verification-verdict-<runId>.json"
  runtimeVerdict: ".claude/runtime-verdict-<runId>.json"
  sprintContract: "{tasksRoot}/{feature-name}/execution/<slice>/SPRINT_CONTRACT.md"
  qaReport: "{tasksRoot}/{feature-name}/execution/<slice>/QA_REPORT.md"
  handoff: "{tasksRoot}/{feature-name}/execution/<slice>/HANDOFF.md"
  scorecard: "{tasksRoot}/{feature-name}/execution/<slice>/SCORECARD.md"
  workset: "{tasksRoot}/{feature-name}/execution/<slice>/WORKSET.md"
  worksets: "{tasksRoot}/{feature-name}/execution/<slice>/WORKSETS.yaml"
  requirementsTraceability: "{tasksRoot}/{feature-name}/execution/REQUIREMENTS_TRACEABILITY.md"
  scenarioMatrix: "{tasksRoot}/{feature-name}/execution/SCENARIO_MATRIX.md"
  uatChecklist: "{tasksRoot}/{feature-name}/execution/UAT_CHECKLIST.md"
  teamMetrics: ".claude/team-metrics-<runId>.json"
strict:
  required: true
  triggers:
    - "meta_harness"
    - "workflow-core"
    - "phase-runner"
    - "rules"
    - "skills"
    - "agents"
policySets:
  knowledge:
    description: "Knowledge repository freshness, structure, and source-of-truth integrity"
    checks:
      - knowledgeAudit
  workflow:
    description: "Workflow routing, bounded evidence, and execution discipline"
    checks:
      - workflowEnforcement
      - phaseRuntimeParity
      - phaseRunnerBoundary
      - phaseWorktreeParallel
  acceptance:
    description: "Product acceptance evidence and phase closeout synchronization"
    checks:
      - phaseCloseout
  verification:
    description: "Executable verifier and syntax integrity"
    checks:
      - shellSyntax
  security:
    description: "Machine-checkable policy boundaries for changed code and scripts"
    checks:
      - codePolicy
policy:
  allowIndeterminate: false
  requiredPolicySets:
    - knowledge
    - workflow
    - acceptance
    - verification
    - security
  requiredChecks:
    - knowledgeAudit
    - codePolicy
    - workflowEnforcement
    - shellSyntax
    - phaseRuntimeParity
    - phaseRunnerBoundary
    - phaseWorktreeParallel
    - phaseCloseout
qa:
  evaluatorMode: "separate"
  hardFailOn:
    - "knowledge_repo_audit_failed"
    - "code_policy_failed"
    - "missing_policy_anchor"
    - "verification_evidence_missing"
    - "requirements_traceability_missing"
    - "critical_scenario_evidence_missing"
  criteria:
    policyPropagation:
      threshold: "pass"
      focus:
        - "phase attempts inherit policy anchors through SPRINT_CONTRACT"
        - "core workflow edits stay on the strict path"
    crossRuntimeParity:
      threshold: "pass"
      focus:
        - "Codex and Claude Code use the same orchestrator boundary"
    requirementsCoverage:
      threshold: "pass"
      focus:
        - "every in-scope REQ has implementation and verification evidence"
        - "document completeness is tracked explicitly, not inferred"
    scenarioCoverage:
      threshold: "pass"
      focus:
        - "every critical SCN has fresh runtime or E2E evidence"
        - "user-visible flows are not closed by static review alone"
    uatReadiness:
      threshold: "warn"
      focus:
        - "automation distinguishes uat_ready from uat_complete"
        - "manual sign-off is explicit when required"
observability:
  teamMetrics:
    requiredFields:
      - "selectedPattern"
      - "selectedTeam"
      - "selectionReason"
      - "selectedHarnessComponents"
      - "skippedHarnessComponents"
      - "runtimeIsolation"
      - "modelEffortProfile"
      - "selectedModelProvider"
      - "selectedModel"
      - "selectedModelEffort"
      - "modelSelectionReason"
      - "retryCount"
      - "handoffCount"
      - "indeterminateRatio"
      - "verifierFailureCategories"
      - "completionLeadTimeSeconds"
hooks:
  extraChecksCommand: ""
loop:
  mode: "score_based"
  stopOnFailure: true
  scorecardRequired: true
  scorecardProfile: "auto"
  targetCompletionScore: 100
