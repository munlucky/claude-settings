commands:
  knowledgeAudit: "bash .claude/scripts/knowledge-repo-audit.sh"
  codePolicy: "bash .claude/scripts/verify-code-policy.sh"
  workflowEnforcement: "bash .claude/scripts/workflow-enforcement.sh verify"
  shellSyntax: "bash -n .claude/scripts/knowledge-repo-audit.sh && bash -n .claude/scripts/verify-code-policy.sh && bash -n .claude/scripts/workflow-enforcement.sh && bash -n .claude/scripts/agent-loop.sh && bash -n .claude/scripts/moonshot-phase-dispatch.sh && bash -n .claude/scripts/verify-phase-runtime-parity.sh && bash -n .claude/agents/verification/verify-changes.sh && bash -n .claude/agents/verification/verify-runtime.sh"
  phaseRuntimeParity: "bash .claude/scripts/verify-phase-runtime-parity.sh .claude/docs/runtime-parity-reference-plan"
scope:
  executionPlanes:
    - meta_harness
  paths:
    - "AGENTS.md"
    - ".claude/CLAUDE.md"
    - ".claude/rules/**"
    - ".claude/skills/**"
    - ".claude/agents/**"
    - ".claude/PROJECT.md"
    - ".claude/PROJECT.ko.md"
    - ".claude/README.md"
    - ".claude/README.ko.md"
    - ".claude/docs/guidelines/**"
    - ".claude/docs/reference-downstream/**"
    - ".claude/docs/runtime-parity-reference-plan/**"
    - ".claude/docs/ko/rules/**"
    - ".claude/templates/execution/**"
    - ".claude/scripts/**"
    - ".claude/verification.contract.yaml"
    - ".claudeignore"
    - ".gitignore"
    - "README.md"
    - "install-claude.sh"
  fallbackOutsideScope: true
artifacts:
  verdict: ".claude/verification-verdict-<runId>.json"
  runtimeVerdict: ".claude/runtime-verdict-<runId>.json"
  sprintContract: "{tasksRoot}/{feature-name}/execution/<slice>/SPRINT_CONTRACT.md"
  qaReport: "{tasksRoot}/{feature-name}/execution/<slice>/QA_REPORT.md"
  handoff: "{tasksRoot}/{feature-name}/execution/<slice>/HANDOFF.md"
  scorecard: "{tasksRoot}/{feature-name}/execution/<slice>/SCORECARD.md"
  requirementsTraceability: "{tasksRoot}/{feature-name}/execution/REQUIREMENTS_TRACEABILITY.md"
  scenarioMatrix: "{tasksRoot}/{feature-name}/execution/SCENARIO_MATRIX.md"
  uatChecklist: "{tasksRoot}/{feature-name}/execution/UAT_CHECKLIST.md"
strict:
  required: true
  triggers:
    - "meta_harness"
    - "workflow-core"
    - "phase-runner"
    - "rules"
    - "skills"
    - "agents"
policySets:
  knowledge:
    description: "Knowledge repository freshness, structure, and source-of-truth integrity"
    checks:
      - knowledgeAudit
  workflow:
    description: "Workflow routing, bounded evidence, and execution discipline"
    checks:
      - workflowEnforcement
      - phaseRuntimeParity
  verification:
    description: "Executable verifier and syntax integrity"
    checks:
      - shellSyntax
  security:
    description: "Machine-checkable policy boundaries for changed code and scripts"
    checks:
      - codePolicy
policy:
  allowIndeterminate: false
  requiredPolicySets:
    - knowledge
    - workflow
    - verification
    - security
  requiredChecks:
    - knowledgeAudit
    - codePolicy
    - workflowEnforcement
    - shellSyntax
    - phaseRuntimeParity
qa:
  evaluatorMode: "separate"
  hardFailOn:
    - "knowledge_repo_audit_failed"
    - "code_policy_failed"
    - "missing_policy_anchor"
    - "verification_evidence_missing"
    - "requirements_traceability_missing"
    - "critical_scenario_evidence_missing"
  criteria:
    policyPropagation:
      threshold: "pass"
      focus:
        - "phase attempts inherit policy anchors through SPRINT_CONTRACT"
        - "core workflow edits stay on the strict path"
    crossRuntimeParity:
      threshold: "pass"
      focus:
        - "Codex and Claude Code use the same orchestrator boundary"
    requirementsCoverage:
      threshold: "pass"
      focus:
        - "every in-scope REQ has implementation and verification evidence"
        - "document completeness is tracked explicitly, not inferred"
    scenarioCoverage:
      threshold: "pass"
      focus:
        - "every critical SCN has fresh runtime or E2E evidence"
        - "user-visible flows are not closed by static review alone"
    uatReadiness:
      threshold: "warn"
      focus:
        - "automation distinguishes uat_ready from uat_complete"
        - "manual sign-off is explicit when required"
hooks:
  extraChecksCommand: ""
loop:
  mode: "score_based"
  stopOnFailure: true
  scorecardRequired: true
  scorecardProfile: "auto"
  targetCompletionScore: 100
