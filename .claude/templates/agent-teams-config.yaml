# Agent Teams Configuration
# Used by /moonshot-teams-runner skill
#
# Each team defines a group of parallel workers that can be spawned
# using Claude Code's Agent Teams feature.

schemaVersion: "1.1"

# Prerequisites
prerequisites:
  claudeVersion: "2.1.32"
  envFlag: "CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS"

# Pattern Definitions
patterns:
  pipeline:
    description: "순차 단계 산출물이 다음 단계 입력이 되는 패턴"
  fanout-fanin:
    description: "독립 작업을 병렬로 수행한 뒤 결과를 병합하는 패턴"
  producer-reviewer:
    description: "생산자 산출물을 별도 검토자가 평가하고 수정 피드백을 주는 패턴"
  supervisor:
    description: "중앙 조율자가 작업을 분배하고 결과를 종합하는 패턴"
  hierarchical-delegation:
    description: "상위 조율자가 하위 책임 단위로 재귀 분해하는 패턴"

# Team Definitions
teams:
  # ─────────────────────────────────────────────────────────────────
  # Review Team - Parallel Code Reviews
  # ─────────────────────────────────────────────────────────────────
  review-team:
    description: "병렬 코드 리뷰 팀"
    pattern: "fanout-fanin"
    intent: "구현 결과를 병렬 관점에서 평가하고 리뷰 결과를 병합"
    timeout: 300
    inputContract:
      required:
        - "taskSummary"
        - "changedFiles"
        - "reviewScope"
      optional:
        - "securityFocus"
        - "reactProject"
    outputContract:
      teamReport:
        summary: "핵심 리뷰 결과 요약"
        findings: "우선순위가 높은 리뷰 항목"
        mergeStrategy: "severity-first merge"
    leader:
      role: "orchestrator"
      agent: "team-leader-agent"
      fork: true  # 별도 컨텍스트에서 실행 (메인 세션 오염 방지)
      delegationMode: true  # 리더는 조율만, 직접 리뷰 안함
    members:
      - name: "code-reviewer"
        skill: "codex-review-code"
        focus: "코드 품질, 구조, 가독성"
      - name: "security-reviewer"
        skill: "security-reviewer"
        focus: "보안 취약점, 인증/인가, 민감 데이터"
      - name: "react-reviewer"
        skill: "vercel-react-best-practices"
        condition: "signals.reactProject == true"
        focus: "React 성능, 훅 사용, 렌더링 최적화"
    communication:
      enabled: true  # 리뷰어간 발견사항 공유
    aggregation:
      strategy: "merge"
      outputPath: ".claude/docs/team-reports/review-report.md"

  # ─────────────────────────────────────────────────────────────────
  # Research Team - Parallel Analysis
  # ─────────────────────────────────────────────────────────────────
  research-team:
    description: "병렬 분석 팀"
    pattern: "fanout-fanin"
    intent: "요구사항과 코드 문맥을 병렬로 조사한 뒤 통합"
    timeout: 180
    inputContract:
      required:
        - "taskSummary"
        - "targetArea"
      optional:
        - "relatedDocs"
        - "changedFiles"
    outputContract:
      teamReport:
        summary: "요구사항/문맥 통합 요약"
        findings: "구현 전 확인해야 할 사실"
        mergeStrategy: "source-aware merge"
    leader:
      role: "orchestrator"
      agent: "team-leader-agent"
      fork: true
      delegationMode: true
    members:
      - name: "requirements-analyst"
        agent: "requirements-analyzer"
        focus: "요구사항 분석, 스코프 정의"
      - name: "context-builder"
        agent: "context-builder"
        focus: "기존 코드 분석, 관련 파일 파악"
    communication:
      enabled: true
    aggregation:
      strategy: "merge"
      outputPath: ".claude/docs/team-reports/research-report.md"

  # ─────────────────────────────────────────────────────────────────
  # Verify Team - Adversarial Verification
  # ─────────────────────────────────────────────────────────────────
  verify-team:
    description: "이의 제기 검증 팀"
    pattern: "producer-reviewer"
    intent: "구현 설명과 비판을 교차 검증해 최종 권고를 생성"
    timeout: 240
    inputContract:
      required:
        - "implementationSummary"
        - "verificationFocus"
      optional:
        - "qaReport"
        - "runtimeEvidence"
    outputContract:
      teamReport:
        summary: "구현 대 비판 토론 결과"
        findings: "재검증 또는 수정이 필요한 항목"
        mergeStrategy: "debate resolution"
    leader:
      role: "resolver"
      agent: "team-leader-agent"
      fork: true
      prompt: "양측 의견을 종합하여 최종 권고사항 작성"
      delegationMode: true
    members:
      - name: "implementer"
        prompt: "구현 내용을 설명하고 설계 결정의 이유를 제시"
      - name: "critic"
        prompt: "잠재적 문제점, 엣지 케이스, 개선점을 지적"
    communication:
      enabled: true  # 팀원간 소통 허용
      debateRounds: 2
    aggregation:
      strategy: "debate-resolution"
      outputPath: ".claude/docs/team-reports/verify-report.md"

  # ─────────────────────────────────────────────────────────────────
  # Planning Team - Parallel Plan Validation
  # ─────────────────────────────────────────────────────────────────
  planning-team:
    description: "계획 단계 병렬 검증 팀"
    pattern: "fanout-fanin"
    intent: "요구사항, 코드 문맥, 계획 타당성을 병렬 검토"
    timeout: 240
    inputContract:
      required:
        - "planSummary"
        - "taskSummary"
      optional:
        - "productArtifacts"
        - "existingConstraints"
    outputContract:
      teamReport:
        summary: "계획 검증 종합 의견"
        findings: "빠진 요구사항, 의존성, 위험"
        mergeStrategy: "constraint merge"
    leader:
      role: "orchestrator"
      agent: "team-leader-agent"
      fork: true
      delegationMode: true
    members:
      - name: "requirements-analyzer"
        agent: "requirements-analyzer"
        focus: "요구사항 추출 및 검증"
      - name: "context-builder"
        agent: "context-builder"
        focus: "기존 코드베이스 분석"
      - name: "plan-validator"
        skill: "codex-validate-plan"
        focus: "계획 논리 검증, 의존성 체크"
    communication:
      enabled: true
    aggregation:
      strategy: "merge"
      outputPath: ".claude/docs/team-reports/planning-report.md"

  # ─────────────────────────────────────────────────────────────────
  # Quality Team - Post-Implementation Quality Check
  # ─────────────────────────────────────────────────────────────────
  quality-team:
    description: "품질 검증 팀"
    pattern: "fanout-fanin"
    intent: "완료 검증, 규칙 준수, 빌드 안정성을 병렬 확인"
    timeout: 300
    inputContract:
      required:
        - "changedFiles"
        - "verificationScope"
      optional:
        - "qaReport"
        - "projectMemoryBoundaries"
    outputContract:
      teamReport:
        summary: "품질 검증 결과"
        findings: "완료를 막는 품질 이슈"
        mergeStrategy: "blocking-first merge"
    leader:
      role: "orchestrator"
      agent: "team-leader-agent"
      fork: true
      delegationMode: true
    members:
      - name: "completion-verifier"
        skill: "completion-verifier"
        focus: "테스트 기반 완료 검증"
      - name: "memory-reviewer"
        agent: "project-memory-reviewer"
        focus: "프로젝트 규칙/스펙 위반 검증"
      - name: "build-checker"
        skill: "build-error-resolver"
        focus: "빌드 오류 사전 탐지"
    communication:
      enabled: true
    aggregation:
      strategy: "merge"
      outputPath: ".claude/docs/team-reports/quality-report.md"

  # ─────────────────────────────────────────────────────────────────
  # Analysis Team - Parallel PM Analysis
  # ─────────────────────────────────────────────────────────────────
  analysis-team:
    description: "PM 분석 병렬화 팀"
    pattern: "fanout-fanin"
    intent: "작업 분류, 복잡도, 불확실성을 병렬 평가"
    timeout: 180
    inputContract:
      required:
        - "userMessage"
      optional:
        - "repoSignals"
        - "openFiles"
    outputContract:
      teamReport:
        summary: "분석 결과 요약"
        findings: "분류, 복잡도, 불확실성 판단"
        mergeStrategy: "analysis merge"
    leader:
      role: "orchestrator"
      agent: "team-leader-agent"
      fork: true
      delegationMode: true
    members:
      - name: "classifier"
        skill: "moonshot-classify-task"
        focus: "작업 유형 분류"
      - name: "complexity-analyzer"
        skill: "moonshot-evaluate-complexity"
        focus: "복잡도 평가, 예상 작업량"
      - name: "uncertainty-detector"
        skill: "moonshot-detect-uncertainty"
        focus: "불확실성 검출, 질문 도출"
    communication:
      enabled: true
    aggregation:
      strategy: "merge"
      outputPath: ".claude/docs/team-reports/analysis-report.md"

  # ─────────────────────────────────────────────────────────────────
  # Fix Team - Error Resolution
  # ─────────────────────────────────────────────────────────────────
  fix-team:
    description: "문제 해결 팀"
    pattern: "supervisor"
    intent: "실패 유형별 복구 경로를 조율해 해결안을 제시"
    timeout: 300
    inputContract:
      required:
        - "failureSummary"
        - "changedFiles"
      optional:
        - "buildLog"
        - "securityFindings"
    outputContract:
      teamReport:
        summary: "복구 경로와 권장 조치"
        findings: "우선 처리할 복구 항목"
        mergeStrategy: "recovery merge"
    leader:
      role: "orchestrator"
      agent: "team-leader-agent"
      fork: true
      delegationMode: true
    members:
      - name: "build-resolver"
        skill: "build-error-resolver"
        focus: "빌드/컴파일 에러 해결"
      - name: "security-fixer"
        skill: "security-reviewer"
        focus: "보안 취약점 수정"
    condition: "signals.buildFailed == true || signals.securityConcern == true"
    communication:
      enabled: true
    aggregation:
      strategy: "merge"
      outputPath: ".claude/docs/team-reports/fix-report.md"

  # ─────────────────────────────────────────────────────────────────
  # 🆕 Implementation Team - Parallel Feature Implementation
  # ─────────────────────────────────────────────────────────────────
  impl-team:
    description: "병렬 구현 팀 - 새 모듈/기능 개발"
    pattern: "hierarchical-delegation"
    intent: "파일 소유권을 분리해 구현을 병렬 위임"
    timeout: 600
    requirePlanApproval: true  # 계획 승인 후 구현
    inputContract:
      required:
        - "planSummary"
        - "fileOwnershipPlan"
        - "verificationCommands"
      optional:
        - "apiContracts"
        - "testScope"
    outputContract:
      teamReport:
        summary: "병렬 구현 결과와 남은 통합 이슈"
        findings: "충돌 위험, 미완료 영역"
        mergeStrategy: "ownership-aware merge"
    leader:
      role: "coordinator"
      agent: "team-leader-agent"
      fork: true
      delegationMode: true  # 리더는 조율만, 직접 구현 안함
      approvalCriteria:
        - "테스트 커버리지 계획 포함"
        - "기존 패턴과 일관성"
        - "파일 소유권 충돌 없음"
    members:
      - name: "feature-dev-1"
        prompt: "할당된 모듈/기능 구현. 다른 팀원 파일 수정 금지."
        focus: "주요 기능 구현"
      - name: "feature-dev-2"
        prompt: "할당된 모듈/기능 구현. 다른 팀원 파일 수정 금지."
        focus: "보조 기능 구현"
        condition: "analysisContext.estimates.estimatedFiles > 5"
      - name: "test-writer"
        prompt: "구현된 기능에 대한 테스트 작성"
        focus: "테스트 코드 작성"
        ownedPaths: ["tests/", "**/*.test.ts", "**/*.spec.ts"]
      - name: "code-simplifier"
        skill: "code-simplifier"
        focus: "구현 완료된 코드의 복잡성 감소, 가독성 개선"
        condition: "signals.implementationComplete == true"
    communication:
      enabled: true  # 팀원간 API 스펙 논의 등
    fileOwnership:
      enabled: true  # 파일 충돌 방지
      strategy: "exclusive"
    aggregation:
      strategy: "merge"
      outputPath: ".claude/docs/team-reports/impl-report.md"

  # ─────────────────────────────────────────────────────────────────
  # 🆕 Cross-Layer Team - Frontend/Backend/Test Coordination
  # ─────────────────────────────────────────────────────────────────
  cross-layer-team:
    description: "교차 계층 조율 팀 - 프론트엔드/백엔드/테스트"
    pattern: "hierarchical-delegation"
    intent: "레이어별 책임을 분리하고 API 계약을 중심으로 통합"
    timeout: 600
    requirePlanApproval: true
    inputContract:
      required:
        - "planSummary"
        - "layerBoundaries"
        - "apiContracts"
      optional:
        - "testStrategy"
        - "integrationRisks"
    outputContract:
      teamReport:
        summary: "교차 계층 구현 결과"
        findings: "계층 간 계약 위반 또는 통합 리스크"
        mergeStrategy: "contract-aware merge"
    leader:
      role: "coordinator"
      agent: "team-leader-agent"
      fork: true
      delegationMode: true
      approvalCriteria:
        - "API 계약 명확"
        - "각 레이어 책임 분리"
    members:
      - name: "frontend-dev"
        prompt: "프론트엔드 컴포넌트 및 UI 구현. API 호출부 작성."
        focus: "프론트엔드 구현"
        ownedPaths:
          - "src/components/"
          - "src/pages/"
          - "src/app/"
          - "src/hooks/"
      - name: "backend-dev"
        prompt: "API 엔드포인트 및 백엔드 로직 구현."
        focus: "백엔드 구현"
        ownedPaths:
          - "src/api/"
          - "src/services/"
          - "src/lib/"
          - "server/"
      - name: "test-dev"
        prompt: "유닛 테스트 및 통합 테스트 작성."
        focus: "테스트 구현"
        ownedPaths:
          - "tests/"
          - "**/*.test.ts"
          - "**/*.spec.ts"
          - "__tests__/"
      - name: "code-simplifier"
        skill: "code-simplifier"
        focus: "각 레이어 구현 코드의 복잡성 감소"
        condition: "signals.implementationComplete == true"
    communication:
      enabled: true
      # 프론트엔드가 백엔드에 API 스펙 문의 가능
    fileOwnership:
      enabled: true
      strategy: "exclusive"  # 각 팀원은 자기 경로만 수정
    aggregation:
      strategy: "merge"
      outputPath: ".claude/docs/team-reports/cross-layer-report.md"

  # ─────────────────────────────────────────────────────────────────
  # 🆕 Debug Team - Competing Hypothesis Investigation
  # ─────────────────────────────────────────────────────────────────
  debug-team:
    description: "디버깅 팀 - 경쟁 가설 조사"
    pattern: "producer-reviewer"
    intent: "경쟁 가설을 토론시켜 가장 가능성 높은 원인을 도출"
    timeout: 300
    inputContract:
      required:
        - "bugSummary"
        - "observedSymptoms"
      optional:
        - "logs"
        - "reproSteps"
    outputContract:
      teamReport:
        summary: "가장 가능성 높은 원인과 재현 경로"
        findings: "추가 실험 또는 수정 후보"
        mergeStrategy: "hypothesis resolution"
    leader:
      role: "resolver"
      agent: "team-leader-agent"
      fork: true
      prompt: "각 조사자의 가설을 평가하고 가장 유력한 원인 결정"
      delegationMode: true
    members:
      - name: "investigator-1"
        prompt: "첫 번째 가설 조사. 다른 조사자의 가설에 도전하고 반박."
        focus: "가설 1 조사"
      - name: "investigator-2"
        prompt: "두 번째 가설 조사. 다른 조사자의 가설에 도전하고 반박."
        focus: "가설 2 조사"
      - name: "investigator-3"
        prompt: "세 번째 가설 조사. 다른 조사자의 가설에 도전하고 반박."
        focus: "가설 3 조사"
        condition: "analysisContext.complexity in ['high', 'critical']"
    communication:
      enabled: true
      debateRounds: 3  # 과학적 논쟁처럼 서로 반박
    aggregation:
      strategy: "debate-resolution"
      outputPath: ".claude/docs/team-reports/debug-report.md"

# Orchestrator Integration
orchestratorHooks:
  patternRouting:
    - pattern: "fanout-fanin"
      useFor:
        - "parallel analysis"
        - "parallel review"
        - "multi-angle validation"
      preferredTeams:
        - "analysis-team"
        - "research-team"
        - "planning-team"
        - "review-team"
        - "quality-team"
    - pattern: "producer-reviewer"
      useFor:
        - "adversarial verification"
        - "debugging by competing hypotheses"
      preferredTeams:
        - "verify-team"
        - "debug-team"
    - pattern: "hierarchical-delegation"
      useFor:
        - "multi-owner implementation"
        - "cross-layer feature delivery"
      preferredTeams:
        - "impl-team"
        - "cross-layer-team"
    - pattern: "supervisor"
      useFor:
        - "failure recovery"
      preferredTeams:
        - "fix-team"
  triggers:
    # 기존 트리거
    - team: "review-team"
      after: "implementation-runner"
      condition: "analysisContext.complexity in ['high', 'critical']"
    - team: "research-team"
      before: "context-builder"
      condition: "analysisContext.estimates.estimatedFiles > 10"
    - team: "planning-team"
      after: "moonshot-plan-writer"
      condition: "analysisContext.complexity in ['high', 'critical']"
    - team: "quality-team"
      after: "completion-verifier"
      condition: "signals.useAgentTeams == true"
    - team: "analysis-team"
      before: "moonshot-classify-task"
      condition: "signals.useAgentTeams == true"
    - team: "fix-team"
      after: "build-error-resolver"
      condition: "signals.buildFailed == true"
    # 🆕 새 트리거
    - team: "impl-team"
      after: "moonshot-plan-writer"
      condition: "signals.useParallelImpl == true && analysisContext.estimates.estimatedFiles > 3"
    - team: "cross-layer-team"
      after: "moonshot-plan-writer"
      condition: "signals.crossLayerChange == true"
    - team: "debug-team"
      on: "debug-request"
      condition: "signals.debugMode == true"

# Global Settings
settings:
  logDirectory: ".claude/logs/teams/"
  maxConcurrentTeams: 1  # 동시 팀 실행 제한 (세션당 하나)
  defaultTimeout: 300
  defaultDelegationMode: true  # 모든 리더에 기본 적용
  defaultCommunication: true   # 모든 팀에 통신 기본 활성화
  notesContract:
    requiredFields:
      - "selectedPattern"
      - "selectedTeam"
      - "selectionReason"
