schema:
  name: analysisContext
  version: "1.1"
  purpose: "Canonical contract for Moonshot orchestration, routing, and bounded-direct workflow evidence."

defaults:
  request:
    userMessage: "{runtime-input}"
    taskType: unknown
    keywords: []
  repo:
    gitBranch: "{runtime-input}"
    gitStatus: "{runtime-input}"
    openFiles: []
    changedFiles: []
  signals:
    executionPlane: unknown
    hasContextMd: false
    hasPendingQuestions: false
    requirementsClear: false
    implementationReady: false
    implementationComplete: false
    productDefinitionRequest: false
    hasProductIntent: false
    hasPrd: false
    hasSolution: false
    hasSpec: false
    hasExecutionPlan: false
    productPackageReady: false
    hasMockImplementation: false
    apiSpecConfirmed: false
    reactProject: false
    useAgentTeams: false
    testEnvironmentDetected: false
    testFramework: null
    testsWritten: false
    sprintContractReady: false
    qaReportReady: false
    handoffRequired: false
    planInvalidated: false
    userCorrection: false
    phaseLoopInSession: false
    phaseAttemptMode: false
    workflowProfile: standard
    projectContractReady: false
    contextReady: false
    verificationContractReady: false
    designApproved: false
    isolatedWorkspaceReady: false
    evidenceGateRequired: true
    allowIndeterminate: true
    harnessVerdictRequired: true
  estimates:
    estimatedFiles: 0
    estimatedLines: 0
    estimatedTime: unknown
  phase: unknown
  complexity: unknown
  missingInfo: []
  decisions:
    recommendedAgents: []
    bundleChain: []
    skillChain: []
    parallelGroups: []
  teamSelection:
    requestedPattern: null
    selectedPattern: null
    selectedTeam: null
    selectionReason: null
  fixForward:
    enabled: true
    policy:
      critical: block
      high: fix-forward-task
      medium: merge-with-note
      low: auto-approve
    tasks: []
  readiness:
    planningReady: false
    executionReady: false
    planningBasis: none
    executionBasis: none
    phaseAttemptOverride: false
  artifacts:
    tasksRoot: "{PROJECT.md:documentPaths.tasksRoot}"
    workflowGuidePath: "workflow/README.md"
    designGuidePath: "docs/design/README.md"
    glossaryGuidePath: "docs/glossary/README.md"
    dailyGuidePath: "docs/daily/README.md"
    dailyLogDir: "docs/daily"
    testGuidePath: "TEST_GUIDE.md"
    analysisRoot: "docs/analysis"
    analysisIndexPath: "docs/analysis/README.md"
    contextDocPath: "{tasksRoot}/{feature-name}/context.md"
    productDir: "{tasksRoot}/{feature-name}/product"
    productIntentPath: "{productDir}/PRODUCT_INTENT.md"
    prdPath: "{productDir}/PRD.md"
    solutionPath: "{productDir}/SOLUTION.md"
    specPath: "{productDir}/SPEC.md"
    planPath: "{productDir}/PLAN.md"
    assumptionsPath: "{productDir}/ASSUMPTIONS.md"
    blockersPath: "{productDir}/BLOCKERS.md"
    taskSliceGlob: "{productDir}/tasks/*.md"
    executionRoot: "{tasksRoot}/{feature-name}/execution"
    activeSliceDir: "{executionRoot}/{active-slice}"
    activePhaseDocPath: null
    sprintContractPath: "{activeSliceDir}/SPRINT_CONTRACT.md"
    qaReportPath: "{activeSliceDir}/QA_REPORT.md"
    handoffPath: "{activeSliceDir}/HANDOFF.md"
    scorecardPath: "{activeSliceDir}/SCORECARD.md"
    phaseStatusFile: ".claude/docs/phase-status.yaml"
    verificationContractPath: ".claude/verification.contract.yaml"
    verificationScript: ".claude/agents/verification/verify-changes.sh"
    runtimeVerificationScript: ".claude/agents/verification/verify-runtime.sh"
    verificationResultPath: "{tasksRoot}/{feature-name}/verification-result.json"
    workflowEvidencePath: ".claude/logs/workflow-enforcement/latest-bounded.json"
  tokenBudget:
    specSummaryTrigger: 2000
    splitTrigger: 5
    contextMaxTokens: 8000
    warningThreshold: 0.8
  projectMemory:
    backend: MemoryGraph
    contractVersion: "memorygraph-workflow-v1"
    projectId: null
    stage: null
    lastStage: null
    loaded: false
    boundaryStatus: "not_checked"
    memoryMode: "read_only"
    stageCoverage:
      intake: not_checked
      plan: not_checked
      ready: not_checked
      execute: not_checked
      review: not_checked
      verify: not_checked
      finish: not_checked
      commit: not_checked
    context:
      project_path: null
      project_id: null
      tags: []
    boundary:
      violations: []
      needsApproval: []
      reminders: []
    deltas:
      boundaries: []
      conventions: []
      componentRules: []
      priorDecisions: []
      verificationHints: []
    omitted:
      duplicatedSystemRules: []
      humanMirrorDocs:
        - ".claude/docs/ko/"
      staleOrLowConfidence: []
    relatedConventions: []
    lastFingerprint: null
    lastChecked: null
  workflowEvidence:
    mode: bounded-direct
    selectedBundles: []
    requiredSkills: []
    stageOrder: []
    appliedSkills: []
    skippedSkills: []
    evidenceFiles:
      analysisContext: ".claude/docs/moonshot-analysis.yaml"
      sprintContract: null
      qaReport: null
      handoff: null
  completionModel:
    state: not_started
    closeoutStatus: active
    currentStage: plan
    blockers: []
  notes: []

executionPlanes:
  read_only:
    requiredSignals:
      - executionPlane
      - workflowProfile
    requiredDecisions:
      - bundleChain
      - skillChain
  product_project:
    requiredSignals:
      - executionPlane
      - requirementsClear
      - implementationReady
      - projectContractReady
      - contextReady
      - verificationContractReady
    requiredArtifacts:
      - contextDocPath
      - executionRoot
      - verificationContractPath
  meta_harness:
    requiredSignals:
      - executionPlane
      - workflowProfile
      - harnessVerdictRequired
    requiredArtifacts:
      - phaseStatusFile
      - workflowEvidencePath
      - verificationContractPath

workflowRules:
  initialization:
    - "Initialize from this contract before task classification or bundle selection."
    - "Record file paths only in analysisContext; do not inline document contents."
    - "Keep workflowEvidence current for bounded-direct work."
  readiness:
    - "Resolve executionPlane before task classification."
    - "Resolve workflowProfile before final bundle selection."
    - "Use readiness.planningReady as the canonical chain-selection gate."
    - "Use readiness.executionReady as the canonical active-slice execution gate."
    - "Treat phaseAttemptMode as an execution-baseline override."
  persistence:
    - "Save final analysisContext to .claude/docs/moonshot-analysis.yaml."
    - "Keep workflowEvidence selectedBundles, requiredSkills, and stageOrder populated for code-changing bounded work."
    - "Keep readiness and completionModel aligned with the active execution artifacts."
    - "Track MemoryGraph stageCoverage and omit duplicated system/developer/AGENTS/rules content from projectMemory deltas."
