version: "1.0"
purpose: "Canonical bundle routing registry for Moonshot orchestration and enforcement."

bundleSelection:
  read_only:
    default:
      bundleChain: [memory-intake-bundle]
    reviewRequested:
      bundleChain:
        - memory-intake-bundle
        - review-bundle
  product_project:
    productDefinitionUpstream:
      when:
        productDefinitionRequest: true
        productPackageReady: false
      routeTo: product-orchestrator
      bundleChain: [memory-intake-bundle]
    withProductPackage:
      simple:
        bundleChain: [memory-intake-bundle, ready-isolate-bundle, implementation-lite-bundle, review-bundle, verification-lite-bundle, finish-bundle]
      medium:
        bundleChain: [memory-intake-bundle, ready-isolate-bundle, implementation-bundle, review-bundle, verification-bundle, finish-bundle]
      complex:
        bundleChain: [memory-intake-bundle, ready-isolate-bundle, implementation-bundle, review-bundle, verification-bundle, finish-bundle]
    withoutProductPackage:
      simple:
        bundleChain: [memory-intake-bundle, ready-isolate-bundle, planning-bundle, implementation-lite-bundle, review-bundle, verification-lite-bundle, finish-bundle]
      medium:
        bundleChain: [memory-intake-bundle, ready-isolate-bundle, planning-bundle, implementation-bundle, review-bundle, verification-bundle, finish-bundle]
      complex:
        bundleChain: [memory-intake-bundle, ready-isolate-bundle, planning-bundle, implementation-bundle, review-bundle, verification-bundle, finish-bundle]
  meta_harness:
    simple:
      bundleChain: [memory-intake-bundle, implementation-lite-bundle, review-bundle, verification-lite-bundle, finish-bundle]
    medium:
      bundleChain: [memory-intake-bundle, meta-harness-bundle, review-bundle, verification-bundle, finish-bundle]
    complex:
      bundleChain: [memory-intake-bundle, meta-harness-bundle, review-bundle, verification-bundle, finish-bundle]

bundleExpansion:
  memory-intake-bundle: [project-memory-agent]
  memory-refresh-bundle: [project-memory-refresh]
  harness-memory-promotion-bundle: [harness-memory-promoter]
  implementation-lite-bundle: [implementation-runner]
  ready-isolate-bundle: [pre-flight-check, project-contract-gate, context-readiness-gate, verification-contract-gate]
  planning-bundle: [project-memory-agent, requirements-analyzer, context-builder, codex-validate-plan]
  implementation-bundle: [project-memory-check, karpathy-execution-gate, implementation-runner, code-simplifier]
  verification-lite-bundle: [project-memory-agent, verify-changes.sh]
  verification-bundle: [project-memory-agent, browser-verifier, completion-verifier]
  review-bundle: [codex-review-code, project-memory-reviewer, security-reviewer, audit, web-design-guidelines]
  finish-bundle: [project-memory-agent, doc-auto-sync, session-logger]
  logging-bundle: [session-logger]
  meta-harness-bundle: [pre-flight-check, project-memory-check, karpathy-execution-gate, implementation-runner]

overlays:
  strict:
    mutate:
      allowIndeterminate: false
    insertBeforeImplementation: [design-approval-gate, workspace-isolation-gate]
    insertAfterVerification: [verification-evidence-gate]
  standard:
    mutate: {}

stageOrder:
  default: [intake, plan, ready/isolate, execute, review, verify, finish/handoff]
  rules:
    - "Run stage-scoped MemoryGraph recall before each non-trivial stage delegates work."
    - "Do not move finish-bundle ahead of the active review or verification verdict."
    - "Meaningful code changes must preserve review -> verify -> finish ordering."

planeSpecificRules:
  read_only:
    - "Must not run implementation or verification bundles."
  product_project:
    - "project-contract-gate, context-readiness-gate, and verification-contract-gate apply only here."
    - "Meaningful file edits keep finish-bundle at the end of the chain."
  meta_harness:
    - "Skip downstream bootstrap gates."
    - "Medium and complex work uses meta-harness-bundle."

additionalRules:
  - when: reactProject
    action: "Insert frontend-design immediately before the first implementation-runner."
  - when: nonTrivialCodeChanged
    action: "Insert code-simplifier after implementation-runner and before final verification."
  - when: reactProject
    action: "Layer browser-verifier into the verification path."
  - when: phaseDocsDetected
    action: "Insert moonshot-phase-runner before implementation-runner unless phaseAttemptMode is true."
  - when: phaseAttemptMode
    action: "Treat activePhaseDocPath and existing execution artifacts as the only planning baseline."
  - when: refactorVerificationFailed
    action: "Insert build-error-resolver after failed verification."

parallelExecution:
  allowed:
    - afterClassification: [moonshot-evaluate-complexity, moonshot-detect-uncertainty]
    - afterImplementation: [codex-review-code, browser-verifier]
    - finishStageLogging: [doc-auto-sync, session-logger]
  forbidden:
    - "codex-validate-plan + implementation-runner"
    - "strict gate + guarded step"
    - "verification-evidence-gate + completion claims"
    - "completion-verifier + code-changing remediation"
memoryGraph:
  contract: ".claude/docs/guidelines/memorygraph-workflow.md"
  defaultMode: read_only
  refreshMode: explicit_or_finish_or_commit
  projectGraphSeed: ".claude/cache/memorygraph/project-graph-seed.json"
  promotionCandidates: ".claude/cache/memorygraph/promotion-candidates.json"
  promotionMode: candidate_requires_approval
  harnessProjectId: claude-settings
  writeAllowedOnlyIn:
    - project-memory-refresh
    - session-logger
    - commit-moonshot
    - harness-memory-promoter
  sourceExclusions:
    - ".claude/docs/ko/"
  dedupeAgainst:
    - system
    - developer
    - AGENTS.md
    - ".claude/rules/**"

codeReviewGraph:
  mode: stage_gated
  buildMode: lazy_update
  backend: code-review-graph
  watch: disabled
  preferForExplicitCodeAnalysis: true
  contract: ".claude/docs/guidelines/code-review-graph-workflow.md"
  mcpServer: code-review-graph
  dataPath: ".code-review-graph/"
  stageCoverage: [plan, execute, review, verify, finish]
  stageRules:
    plan:
      trigger: "Code work that would otherwise require broad file reads."
      use: "Check graph status, then use minimal context or architecture overview before reading many files."
      output: "Related module/file candidates, architecture risks, large-function candidates."
    execute:
      trigger: "Before implementation changes."
      use: "Use target/impact summaries to narrow target files and likely dependencies."
      output: "Target files, likely dependencies, impact radius."
    review:
      trigger: "After meaningful code changes."
      use: "Use detect changes, review context, and impact radius for changed files."
      output: "Changed files, impacted callers/importers/tests, review context summary."
    verify:
      trigger: "Only when codeReviewGraph was already used earlier in the run."
      use: "Do not build a new graph; record whether evidence was used and whether graph state was stale."
      output: "Evidence state and stale/unavailable warning only."
    finish:
      trigger: "When workflow evidence is finalized."
      use: "Record summary-only evidence; never store raw graph output."
      output: "Selected or skipped harness component evidence."
  forbidden:
    - installer_time_build
    - watch
    - crg-daemon_start
    - duplicate_raw_analysis_into_memorygraph
