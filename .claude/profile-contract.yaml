schemaVersion: 1
profileId: claude-development-profile
role: development_profile
canonicalSourceContract: package/package-contract.yaml
compatibilityPolicy: move_with_wrapper_until_phase_06
sourcePolicy:
  durableSourceRoots:
    - skills/
    - agents/
    - rules/
    - scripts/
    - schemas/
    - templates/
    - tests/
    - docs/public/
  generatedProfileRoots:
    - .claude/skills/
    - .claude/agents/
    - .claude/scripts/
    - .claude/schemas/
    - .claude/templates/
  rule: "Edit canonical source first; materialize or wrap .claude profile output from canonical source."
activeRuntimeFiles:
  - .claude/CLAUDE.md
  - .claude/PROJECT.md
  - .claude/README.md
  - .claude/rules/**
  - .claude/verification.contract.yaml
excludedGeneratedState:
  - .claude/logs/**
  - .claude/cache/**
  - .claude/traces/**
  - .claude/browser-artifacts/**
  - .claude/browser-runtime/**
  - .claude/tmp/**
  - .claude/runtime-state.sqlite*
  - .claude/memory.json
  - .claude/memorygraph/**
  - .claude/*verdict*.json
  - .claude/knowledge-repo-audit-*.json
