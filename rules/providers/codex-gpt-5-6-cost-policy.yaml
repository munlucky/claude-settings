schemaVersion: 1
policyId: codex-gpt-5-6-cost-aware-routing
provider: codex
adapterId: codex-gpt-5-6
adapterVersion: 1
applicationMode: advisory
applicationSurface: profile_default
defaults:
  routeClass: normal
  model: gpt-5.6-luna
  effort: high
  autoCompactTokenLimit: 240000
  billingGuardThreshold: 272000
  advisoryHeadroomTokens: null
routes:
  mechanical:
    model: gpt-5.6-luna
    effort: medium
  normal:
    model: gpt-5.6-luna
    effort: high
  hard_reasoning:
    model: gpt-5.6-luna
    effort: xhigh
    fallback: gpt-5.6-sol:high
  long_context:
    model: gpt-5.6-terra
    effort: high
    requiredReason: declared_context_or_state_capability
  critical_review:
    model: gpt-5.6-sol
    effort: max
    approval: bounded_policy
  ultra:
    model: gpt-5.6-sol
    effort: ultra
    approval: per_request
context:
  220000: calibration_only
  240000: configured_auto_compact_boundary
  272000: full_request_billing_guard
enforcement:
  authoritativeTokenSourceOnly: true
  interceptionSurfaceRequired: true
  approximationMode: advisory_only
  unknownMode: advisory_only
pricing:
  inputCreditsPerMillion:
    gpt-5.6-sol: 125
    gpt-5.6-terra: 62.5
    gpt-5.6-luna: 25
  outputCreditsPerMillion:
    gpt-5.6-sol: 750
    gpt-5.6-terra: 375
    gpt-5.6-luna: 150
  longContextInputMultiplier: 2
  longContextOutputMultiplier: 1.5
  cacheWriteInputMultiplier: 1.25
